name: Deploy GitHub Pages

# Dựng site tĩnh rồi deploy. KHÔNG dùng Jekyll — repo này chứa code Java có `{{ }}`
# mà Liquid của Jekyll đọc thành thẻ template rồi vỡ build.
#
# Settings → Pages → Build and deployment → Source phải là "GitHub Actions".
# Để "Deploy from a branch" thì GitHub chạy thêm luồng "pages build and deployment" deploy nguyên
# nhánh main lên CÙNG trang này; hai luồng ghi đè nhau và lượt nào xong sau thì thắng
# (bản từ nhánh không có docs/ và media/).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Không huỷ lượt deploy đang chạy dở (huỷ giữa chừng có thể để Pages ở trạng thái deployment treo);
# lượt mới xếp hàng chờ, các lượt xếp hàng ở giữa bị bỏ qua.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cài thư viện markdown
        run: pip install --quiet markdown pymdown-extensions

      # index.html được đặt ở gốc site nên media phải nằm cạnh nó: _deploy/media/<đường dẫn trong leetcode-38-bai-video>
      - name: Dựng bản một trang (app)
        run: MEDIA_BASE=media/ python3 web/build.py

      - name: Dựng bản nhiều trang (tra cứu)
        run: python3 build_site.py

      - name: Gom vào _deploy
        run: |
          mkdir -p _deploy/docs _deploy/media
          cp web/index.html _deploy/index.html
          cp -R site/. _deploy/docs/
          (cd leetcode-38-bai-video && find . -path '*/nhom-*/bai-*/*' \( -name 'bai-*-full.mp4' -o -name 'bai-*.gif' \) \
            -exec cp --parents {} ../_deploy/media/ \;)
          # video bài giảng Java System Design (tab Video của app): web/build.py trỏ vào media/jsd/
          mkdir -p _deploy/media/jsd
          find java-system-design/video-gd1/lessons -maxdepth 1 \( -name 'ep*.mp4' -o -name 'ep*.jpg' \) \
            -exec cp {} _deploy/media/jsd/ \;
          echo "— media —"
          find _deploy/media -type f | sort
          touch _deploy/.nojekyll
          echo "— nội dung sẽ deploy —"
          du -sh _deploy
          ls -la _deploy

      - name: Kiểm tra đầu ra không rỗng
        run: |
          test -s _deploy/index.html || { echo "index.html rỗng"; exit 1; }
          test -s _deploy/docs/index.html || { echo "docs/index.html rỗng"; exit 1; }
          grep -q 'Algorithms Learning' _deploy/index.html || { echo "app không có nội dung"; exit 1; }
          grep -q 'MEDIA_BASE = "media/"' _deploy/index.html || { echo "index.html chưa trỏ media/"; exit 1; }
          test -n "$(find _deploy/media -name '*.mp4')" || { echo "không có video trong _deploy/media"; exit 1; }
          # mọi video trong lessons.json phải có file đi kèm, nếu không tab Video hiện ô lỗi
          python3 - <<'PY'
          import json, pathlib, sys
          m = pathlib.Path("java-system-design/video-gd1/lessons/lessons.json")
          if not m.exists():
              sys.exit(0)
          need = [f for x in json.loads(m.read_text())["lessons"] for f in (x["file"], x.get("poster")) if f]
          miss = [f for f in need if not pathlib.Path("_deploy/media/jsd", f).exists()]
          print(f"video bài giảng: {len(need) - len(miss)}/{len(need)} file có trong _deploy/media/jsd")
          sys.exit(f"thiếu: {miss}" if miss else 0)
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _deploy

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      # Bước đầu của deploy-pages là xin OIDC token. Dịch vụ token đôi khi timeout (đã gặp ngày
      # 07/10/2026: "Failed to get ID Token ... Request timeout"); action khi đó luôn in thêm gợi ý
      # "Ensure GITHUB_TOKEN has permission id-token: write" dù quyền vẫn đủ. Lỗi tạm thời → thử lại 1 lần.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Chờ trước khi thử lại
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4

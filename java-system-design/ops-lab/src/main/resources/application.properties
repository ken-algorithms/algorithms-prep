server.port=8080
# Pool NHO co chu dich: 10 connection, giong nhieu service that. Trần throughput = 10 / thoi gian giu.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
spring.sql.init.mode=always
# Bat bang VT=true de thu: virtual thread KHONG pha duoc tran cua pool
spring.threads.virtual.enabled=${VT:false}
management.endpoints.web.exposure.include=health,metrics
partner.base-url=http://localhost:18081
partner.delay-ms=50
logging.level.root=WARN
logging.level.com.prep=INFO

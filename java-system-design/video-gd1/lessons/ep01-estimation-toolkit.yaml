    lines:
      - tom: "Recap. A day is about 10^5 seconds, a million requests a day is about 12 per second, and the peak is two to three times the average."
        say: "Recap. A day is about ten to the fifth seconds, a million requests a day is about twelve per second, and the peak is two to three times the average."
        reveal: 0
        focus: 0
      - tom: "Three nines is almost nine hours of downtime a year; four nines is under an hour."
        reveal: 1
        focus: 1
      - tom: "Know the latency ladder by order of magnitude, and remember Little's Law: a pool size divided by the hold time is a hard ceiling."
        reveal: [2, 3]
        focus: 3

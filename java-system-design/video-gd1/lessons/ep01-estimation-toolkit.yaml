  - kind: table
    chapter: "Conversions"
    heading: "Conversions to do in your head"
    columns: ["Quantity", "Remember as", "Note"]
    widths: [1.3, 2, 2.6]
    mono: [1]
    points: [conv-day]
    rows:
      - ["1 day", "86,400 s ≈ 10⁵ s", "16% off — fine for estimates"]
      - ["1 month", "≈ 2.5 × 10⁶ s", ""]
      - ["1 year", "≈ 3.15 × 10⁷ s", "used for yearly storage"]
    lines:
      - tom: "Start with time. One day is 86,400 seconds. Round it to 10^5. That's 16% off, which is fine for an estimate."
        say: "Start with time. One day is eighty-six thousand four hundred seconds. Round it to ten to the fifth. That's sixteen percent off, which is fine for an estimate."
        focus: 0
      - tom: "A month is about 2.5 × 10^6 seconds, and a year about 3.15 × 10^7."
        say: "A month is about two point five times ten to the sixth seconds, and a year about three point one five times ten to the seventh."
        focus: 2

  - kind: table
    heading: "From requests per day to requests per second"
    columns: ["Per day", "Per second (average)"]
    widths: [2, 3]
    mono: [1]
    accent: [1]
    points: [conv-rps, conv-peak]
    rows:
      - ["1 million requests", "≈ 12 RPS"]
      - ["1 billion requests", "≈ 12,000 RPS"]
      - ["Peak", "average × 2–3, or by peak-hour share: 10% of the day in one hour → × 2.4"]
    lines:
      - tom: "Requests per day to requests per second. One million a day is about 12 RPS on average."
        focus: 0
      - tom: "One billion a day is about 12,000 RPS."
        focus: 1
      - tom: "The peak is two to three times the average. Or, if you know that the busiest hour carries 10% of the day, multiply by 2.4, because an even spread would put only one twenty-fourth in each hour."
        say: "The peak is two to three times the average. Or, if you know that the busiest hour carries ten percent of the day, multiply by two point four, because an even spread would put only one twenty-fourth in each hour."
        focus: 2


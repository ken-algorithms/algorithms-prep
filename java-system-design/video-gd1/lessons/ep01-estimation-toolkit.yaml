  - kind: acronyms
    chapter: "Acronyms in this video"
    heading: "Acronyms in this video (1/2)"
    items:
      - {abbr: RPS, full: "requests per second", vi: "số request mỗi giây"}
      - {abbr: QPS, full: "queries per second", vi: "thường dùng như RPS; với database là số truy vấn mỗi giây"}
      - {abbr: JMH, full: "Java Microbenchmark Harness", vi: "thư viện đo hiệu năng hàm Java đúng cách"}
      - {abbr: SPOF, full: "single point of failure", vi: "điểm chết đơn: một thứ hỏng là cả hệ thống ngừng"}
      - {abbr: HTTP, full: "Hypertext Transfer Protocol", vi: "giao thức của web và REST API"}
      - {abbr: CPU, full: "central processing unit", vi: "bộ xử lý"}
      - {abbr: RAM, full: "random-access memory", vi: "bộ nhớ chính"}
      - {abbr: SSD, full: "solid-state drive", vi: "ổ cứng thể rắn"}
      - {abbr: AZ, full: "availability zone", vi: "một trung tâm dữ liệu độc lập trong một region"}
      - {abbr: "ns · µs · ms", full: "nanosecond · microsecond · millisecond", vi: "một phần tỷ · phần triệu · phần nghìn giây"}
    lines:
      - tom: "RPS is requests per second. QPS is queries per second; people use it like RPS. JMH is the Java Microbenchmark Harness, the tool we use to measure code."
        focus: 1
      - tom: "SPOF is a single point of failure. HTTP is the web protocol. CPU is the processor, RAM is main memory, SSD a solid-state drive, and an AZ is an availability zone, one data center inside a cloud region."
        focus: 8
      - tom: "And the time units: nanoseconds, microseconds and milliseconds. Each one is a thousand times the previous one."
        focus: 9
  - kind: acronyms
    heading: "Acronyms in this video (2/2)"
    items:
      - {abbr: RTT, full: "round-trip time", vi: "thời gian gói tin đi và về"}
      - {abbr: TCP, full: "Transmission Control Protocol", vi: "giao thức truyền tin cậy, có bắt tay"}
      - {abbr: TLS, full: "Transport Layer Security", vi: "lớp mã hoá kết nối (HTTPS)"}
      - {abbr: GC, full: "garbage collection", vi: "bộ dọn rác của JVM"}
      - {abbr: G1, full: "Garbage-First collector", vi: "GC mặc định của JDK hiện đại"}
      - {abbr: p99, full: "99th percentile latency", vi: "99% request nhanh hơn con số này"}
      - {abbr: SLA, full: "service level agreement", vi: "cam kết có hợp đồng với khách hàng"}
      - {abbr: NAB, full: "National Australia Bank", vi: "một hướng ứng tuyển: app ở VN gọi hệ thống ở Úc"}
      - {abbr: "KB … TB", full: "kilobyte, megabyte, gigabyte, terabyte", vi: "đơn vị dung lượng, mỗi bậc × 1.000 khi ước lượng"}
    lines:
      - tom: "RTT is round-trip time. TCP and TLS are the transport protocol and the encryption layer under HTTPS."
        focus: 2
      - tom: "GC is garbage collection, and G1 is Java's default collector. p99 is the 99th percentile latency. SLA is a service level agreement. And NAB is National Australia Bank."
        say: "G C is garbage collection, and G one is Java's default collector. p99 is the ninety-ninth percentile latency. SLA is a service level agreement. And NAB is National Australia Bank."
        focus: 7
      - tom: "Sizes go kilobyte, megabyte, gigabyte, terabyte; for estimates, each step is a thousand times bigger."
        focus: 8


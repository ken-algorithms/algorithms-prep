        focus: 0
      - tom: "Bandwidth is RPS times the average response size. You'll use both formulas in exercise 1.1, in episode three."
        say: "Bandwidth is RPS times the average response size. You'll use both formulas in exercise one point one, in episode three."
        focus: 1

  - kind: table
    heading: "Availability: count the nines"
    columns: ["Availability", "Down per year", "Down per month"]
    widths: [1, 1, 1]
    accent: [1, 2]
    points: [conv-nines]
    rows:
      - ["99.9%", "8.8 hours", "43 minutes"]
      - ["99.99%", "53 minutes", "4.3 minutes"]
    note: "Each extra nine divides the allowed downtime by ten."
    lines:
      - tom: "Availability. 99.9% allows 8.8 hours of downtime a year, or 43 minutes a month."
        focus: 0
      - tom: "99.99% allows 53 minutes a year, or 4.3 minutes a month. Each extra nine divides the downtime by ten. A single restart can eat a whole month's budget."
        focus: 1

  - kind: table
    chapter: "Latency numbers"
    heading: "Latency: remember the order of magnitude, not the digits"
    sub: "Part 1 · inside one machine"
    columns: ["Operation", "Order", "Remember by"]
    widths: [2.6, 1, 2.6]
    accent: [1]
    points: [lat-memory]
    rows:
      - ["Read from the CPU's L1 cache", "~1 ns", ""]
      - ["Read from RAM", "~100 ns", "100 × L1 cache"]
      - ["Small Java call, small object allocation", "10–100 ns", "P01–P06 of Track P live around here"]
      - ["Random read from an SSD", "~100 µs", ""]
    lines:
      - tom: "Now latency. Inside one machine: reading the CPU's level-one cache takes about one nanosecond. That L1 is a cache level, not scale level L1."
        say: "Now latency. Inside one machine: reading the CPU's level-one cache takes about one nanosecond. That L one is a cache level, not scale level L one."
        focus: 0
      - tom: "RAM is about 100 nanoseconds, a hundred times slower."
        focus: 1
      - tom: "A small Java method call or object allocation is 10 to 100 nanoseconds. Most of the Track P waste lives here."
        focus: 2
      - tom: "A random read from an SSD is about 100 microseconds."
        focus: 3

  - kind: table
    heading: "Latency: remember the order of magnitude, not the digits"
    sub: "Part 2 · network and garbage collection"
    columns: ["Operation", "Order", "Remember by"]
    widths: [2.7, 1.2, 2.8]
    accent: [1]
    points: [lat-network, lat-geo, lat-gc]
    rows:
      - ["Round trip in the same AZ (app ↔ database, app ↔ Redis)", "~0.5–1 ms", "Every query pays at least this, even for one row (P15)"]
      - ["Round trip to another AZ, same region", "~1–2 ms", "The price of a Multi-AZ synchronous commit"]
      - ["TCP + TLS 1.3 handshake to a far server", "2 × RTT", "Why we keep connections alive: keep-alive (P08)"]
      - ["Ho Chi Minh City ↔ Singapore", "~30–40 ms", ""]
      - ["Ho Chi Minh City ↔ Sydney", "~100–150 ms", "NAB: an app in Vietnam calling systems in Australia"]
      - ["Young-generation GC pause (G1, heap of a few GB)", "a few ms → tens of ms", "Lands in your p99"]
    lines:
      - tom: "Over the network, a round trip inside one availability zone costs half a millisecond to one millisecond. Every database query pays at least that, even for a single row."
        focus: 0
      - tom: "Crossing to another zone in the same region costs one to two milliseconds. That is what every commit pays with a synchronous Multi-AZ standby."
        focus: 1
      - tom: "A new connection to a far server needs a TCP and a TLS 1.3 handshake: two round trips before the first byte. That's why clients keep connections alive."
        focus: 2
      - tom: "From Ho Chi Minh City, Singapore is 30 to 40 milliseconds away, and Sydney 100 to 150. That matters for NAB, where an app in Vietnam calls systems in Australia."
        focus: 4
      - tom: "And a young-generation pause of the G1 garbage collector, with a heap of a few gigabytes, takes a few milliseconds up to tens of milliseconds. It shows up in your p99."
        say: "And a young-generation pause of the G one garbage collector, with a heap of a few gigabytes, takes a few milliseconds up to tens of milliseconds. It shows up in your p99."
        focus: 5

  - kind: bullets
    heading: "How to use these numbers"
    style: dot
    points: [lat-caveat]
    items:
      - {t: "They are typical values: re-measure with ping and GC logs from your own machine"}
      - {t: "Use them to make decisions on the whiteboard — never as numbers in an SLA contract"}
      - {t: "Keep the ratios: one same-AZ round trip costs as much time as thousands of RAM reads"}
    lines:
      - tom: "These are typical values. Re-measure the network and GC numbers with ping and GC logs from your own machine."
        focus: 0
      - tom: "Use them to decide on the whiteboard, never as numbers in an SLA. What you must keep is the ratio: one network round trip costs as much as thousands of memory reads."
        focus: 2

  - kind: table
    chapter: "Little's Law"
    heading: "Little's Law: L = λ × W"
    sub: "The formula you will use most in the whole roadmap"
    columns: ["Symbol", "Meaning", "Examples"]
    widths: [0.7, 2.6, 2.8]
    accent: [0]
    points: [little-def]
    rows:
      - ["L", "how many things are inside the system right now", "requests in flight, busy connections, running tests"]
      - ["λ", "throughput: how many arrive (and leave) per second", "requests per second"]
      - ["W", "how long each one stays", "seconds per request, per connection hold"]
    lines:
      - tom: "Little's Law. L equals lambda times W."
        say: "Little's Law. L equals lambda times W."
      - tom: "L is how many things are inside the system right now: requests in flight, busy connections, running tests."
        focus: 0
      - tom: "Lambda is the throughput, how many arrive per second. And W is how long each one stays."
        focus: 2

  - kind: bullets
    heading: "Three ways to use it"
    points: [little-uses]
    items:
      - {t: "Know λ and W → how many workers, connections or pods you need", s: "L = λ × W"}
      - {t: "Know the maximum L (a pool size) and W → the throughput ceiling", s: "λ max = L max ÷ W — this is P09 in Track P"}
      - {t: "L grows while λ stays flat → W is growing", s: "something got slower: look for it before adding machines"}
    lines:
      - tom: "Three ways to use it. One: you know the throughput and the time, so you get how many workers, connections or pods you need."
        focus: 0
      - tom: "Two: you know the maximum L, for example a connection pool size, and the hold time. Then you get the throughput ceiling. This is anti-pattern P09."
        focus: 1
      - tom: "Three: L keeps growing while the throughput stays flat. Then W is growing: something got slower."
        focus: 2

  - kind: table
    heading: "Example: P09 — an HTTP call inside a transaction"
    sub: "From 01 §1: the formula predicted the measurement within 7%"
    columns: ["Step", "Value"]
    widths: [2, 3.2]
    mono: [1]
    build: true
    points: [little-p09]
    rows:
      - ["Connection pool", "10 connections"]
      - ["Hold time per request", "5 + 50 + 5 = 60 ms (read, partner call, write)"]
      - ["Ceiling", "10 ÷ 0.060 s = 166 req/s"]
      - ["Measured", "162.7 req/s"]
      - ["Fix: call the partner outside the transaction", "hold 5 + 5 = 10 ms → 10 ÷ 0.010 s = 1,000 req/s"]
      - ["Measured after the fix", "928–935 req/s"]
    lines:
      - tom: "Here's way two in action. A pool of 10 database connections."
        focus: 0
      - tom: "Each request holds a connection for 60 milliseconds: 5 to read, 50 waiting for a partner's HTTP call, 5 to write."
        focus: 1
      - tom: "So the ceiling is 10 divided by 0.06 seconds: 166 requests per second, no matter how many pods you add."
        say: "So the ceiling is ten divided by zero point zero six seconds: one hundred sixty-six requests per second, no matter how many pods you add."
        focus: 2
      - tom: "The lab measured 162.7."
        focus: 3
      - tom: "Move the partner call out of the transaction, and the hold time drops to 10 milliseconds. The ceiling becomes 1,000 requests per second."
        focus: 4
      - tom: "Measured: 928 to 935. The formula was within 7% before running anything. That is what you say on the whiteboard."
        focus: 5

  - kind: speech
    chapter: "Interview line and recap"
    heading: "Interview line — say it out loud"
    items:
      - {t: "A pool of ten connections, each held for sixty milliseconds, caps the service at about a hundred and sixty-six requests per second."}
      - {t: "Adding pods doesn't raise that ceiling; shortening the hold time does."}
    lines:
      - read: tom
        focus: 0
      - read: tom
        focus: 1


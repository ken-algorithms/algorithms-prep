  - kind: code
    heading: "Answer 1.7 — eight problems"
    code: |
      @Service
      public class StatementService {
          private static final Map<String, byte[]> CACHE = new HashMap<>();

          @Transactional
          public byte[] monthlyStatement(long accountId, String month) throws Exception {
              String key = accountId + ":" + month + ":" + System.currentTimeMillis();
              if (CACHE.containsKey(key)) return CACHE.get(key);
              Account acc = accountRepo.findById(accountId).orElseThrow();
              String fx = new RestTemplate()
                      .getForObject(fxUrl + "?ccy=" + acc.getCurrency(), String.class);
              String csv = "";
              for (Txn t : txnRepo.findAll()) {
                  if (t.getAccountId() == accountId && t.getMonth().equals(month)) {
                      csv += t.getId() + "," + t.getAmount() + "," + fx + "\n";
                      log.debug("added " + t);
                  }
              }
              byte[] out = new ObjectMapper().writeValueAsBytes(Map.of("csv", csv));
              CACHE.put(key, out);
              return out;
          }
      }
    points: [ex17-issues]
    items:
      - {lines: [3, 8], t: "1 · P18: unbounded static HashMap; currentTimeMillis in the key → never hits, only leaks; not thread-safe"}
      - {lines: [5, 11], t: "2 · P09: HTTP call for the exchange rate inside @Transactional"}
      - {lines: [10, 11], t: "3 · P08 + P10: new RestTemplate() per call, no timeout"}
      - {lines: [13, 14], t: "4 · P16 + P19: findAll() then filter in Java"}
      - {lines: [15, 15], t: "5 · P03: csv += in a loop"}
      - {lines: [16, 16], t: "6 · P06: log.debug with string concatenation in the loop"}
      - {lines: [19, 19], t: "7 · P01: new ObjectMapper() per call"}
      - {lines: [19, 19], t: "8 · P19 (bonus): CSV wrapped in JSON, returned as byte[]"}
    lines:
      - tom: "One: a static HashMap with no limit, and the key contains the current time in milliseconds, so it never hits. It only leaks. And it isn't thread-safe. Fix: drop the timestamp, use Caffeine with a maximum size and an expiry."
        focus: 0
      - tom: "Two: the HTTP call for the exchange rate happens inside the transaction. That's P09. Fetch the rate first, cached, and keep the transaction short and read-only."
        focus: 1
      - tom: "Three: a new RestTemplate on every call, with no timeout. That's P08 and P10. Use one shared client bean with connect and read timeouts, and a fallback."
        focus: 2
      - tom: "Four: findAll, then filtering in Java, reads the whole table. That's P16 and P19. Query by account and month, with an index on those two columns, and stream large months."
        focus: 3
      - tom: "Five: plus-equals on a string in a loop, P03. Use a StringBuilder, or write straight to the output stream."
        focus: 4
      - tom: "Six: a debug log built by concatenation inside the loop, P06. Use a placeholder with just the id, or remove it."
        focus: 5
      - tom: "Seven: a new ObjectMapper on every call, P01. Inject it. And a bonus, eight: wrapping CSV inside JSON. Return text/csv as a stream instead."
        focus: 7


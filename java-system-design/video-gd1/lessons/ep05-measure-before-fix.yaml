  - kind: code
    chapter: "Exercise 1.5"
    heading: "Exercise 1.5 — why is a benchmark written like this?"
    code: |
      @BenchmarkMode(Mode.AverageTime)
      @Warmup(iterations = 3, time = 1)
      @Measurement(iterations = 5, time = 1)
      @Fork(1)
      @State(Scope.Thread)
      public class PerRequestBench {
          private final Transfer transfer = new Transfer("tx-000123", "101-22334455", ...);

          @Benchmark
          public String p01_json_newMapperPerCall() throws Exception {
              return P01ExpensiveObjects.toJsonBad(transfer);
          }
      }
    items:
      - {lines: [7, 7], t: "(a) why a field, not a constant inside the method?"}
      - {lines: [11, 11], t: "(b) why return the value (or use a Blackhole)?"}
      - {lines: [2, 4], t: "(c) why @Warmup and @Fork?"}
    lines:
      - tom: "Exercise 1.5. Look at this benchmark from the lab. Four questions. A: why is the input a field of the class, and not a constant written inside the method?"
        say: "Exercise one point five. Look at this benchmark from the lab. Four questions. Eigh: why is the input a field of the class, and not a constant written inside the method?"
        focus: 0
      - tom: "B: why does the method return its result, or pass it to a Blackhole?"
        focus: 1
      - tom: "C: why warm-up iterations and a fork? And D: why not just measure System.nanoTime around a loop of one million calls?"
        focus: 2
      - wait: 5
        note: "Answer (a) to (d) in one line each."

  - kind: table
    heading: "Answer 1.5"
    columns: ["", "Why", "The trap it avoids"]
    widths: [1.8, 3.2, 1.9]
    accent: [2]
    build: true
    points: [ex15]
    rows:
      - ["(a) Input in a @State field", "A constant can be computed once by the JIT; the benchmark would measure returning a constant", "constant folding"]
      - ["(b) Return the result or use a Blackhole", "An unused result lets the JIT delete the whole computation", "dead code elimination"]
      - ["(c) @Warmup and @Fork", "The first seconds run in the interpreter and C1, not optimised C2 code; a fresh JVM stops one benchmark's profile from skewing the next", "measuring cold code; profile pollution"]
      - ["(d) Not nanoTime around a loop", "A hand-made loop has all three traps plus loop optimisations, and it can't measure allocation", "all of the above"]
    lines:
      - tom: "A: a constant can be computed once by the JIT, so you'd measure returning a constant. That's constant folding."
        say: "Eigh: a constant can be computed once by the JIT, so you'd measure returning a constant. That's constant folding."
        focus: 0
      - tom: "B: if nobody uses the result, the JIT deletes the computation. That's dead code elimination."
        focus: 1
      - tom: "C: the first seconds run in the interpreter and the quick C1 compiler, not the optimised C2 code. Warm-up skips that. And a fork starts a fresh JVM, so one benchmark's profile doesn't skew the next."
        say: "C: the first seconds run in the interpreter and the quick C one compiler, not the optimised C two code. Warm-up skips that. And a fork starts a fresh J V M, so one benchmark's profile doesn't skew the next."
        focus: 2
      - tom: "D: a hand-made loop falls into all three traps, plus loop optimisations, and it can't measure allocation at all."
        focus: 3


  - kind: table
    chapter: "The scale ladder"
    heading: "The scale ladder: five levels (profile A, bank)"
    columns: ["Level", "Scale", "Peak CCU / RPS", "Architecture", "What forces the next level"]
    widths: [0.6, 1.4, 1.2, 3.4, 2.6]
    points: [ladder]
    rows:
      - ["L0", "≤ 10k users, internal, MVP", "< 50 / < 20", "1 VM: Spring Boot + Postgres on the same machine", "One machine dies → everything is lost, data included"]
      - ["L1", "100k users", "400–1,200 / 70–200", "Modular monolith × 2 behind a load balancer, Postgres Multi-AZ, Redis, object storage + CDN, simple job queue", "Availability, deploys without downtime"]
      - ["L2", "1M users", "4k–12k / 670–2,000", "Autoscaling 3–10 pods, read replicas, cache-aside, outbox → Kafka, async workers, API gateway, 2–3 services split for a reason", "Reads load the DB, slow work blocks requests, 3–5 teams"]
      - ["L3", "10M users", "40k–120k / 6.7k–20k", "Microservices by bounded context, a DB per service, Kafka backbone, CDC, multi-AZ everywhere, a disaster-recovery region", "Blast radius, number of teams, the reads, × 3 peaks"]
      - ["L4", "50M+ or several countries", "500k+ / 100k+", "Cell-based (each cell serves a slice of users), multi-region active-active", "One region is a single point of failure; data-residency laws"]
    lines:
      - tom: "First, the ladder. L0 is up to 10k users, an internal tool or an MVP: one VM running Spring Boot and Postgres together. If that machine dies, everything is lost, data included."
        say: "First, the ladder. L zero is up to ten thousand users, an internal tool or an M V P: one V M running Spring Boot and Postgres together. If that machine dies, everything is lost, data included."
        focus: 0
      - tom: "L1 is 100k users: a modular monolith on two instances behind a load balancer, Postgres with a standby in another zone, Redis, a CDN. The driver is availability, not load."
        say: "L one is one hundred thousand users: a modular monolith on two instances behind a load balancer, Postgres with a standby in another zone, Redis, a CDN. The driver is availability, not load."
        focus: 1
      - tom: "L2 is a million users: autoscaling, read replicas, a cache, an outbox feeding Kafka, async workers. The drivers: reads hitting the database, slow work blocking requests, and three to five teams."
        say: "L two is a million users: autoscaling, read replicas, a cache, an outbox feeding Kafka, async workers. The drivers: reads hitting the database, slow work blocking requests, and three to five teams."
        focus: 2
      - tom: "L3 is 10 million: microservices by bounded context, each with its own database, Kafka as the backbone. The drivers: blast radius, the number of teams, and the reads."
        say: "L three is ten million: microservices by bounded context, each with its own database, Kafka as the backbone. The drivers: blast radius, the number of teams, and the reads."
        focus: 3
      - tom: "L4, beyond 50 million or across countries, is cell-based and multi-region. You only need to talk about it, not draw it in detail."
        say: "L four, beyond fifty million or across countries, is cell-based and multi-region. You only need to talk about it, not draw it in detail."
        focus: 4

  - kind: bullets
    heading: "The rule of the ladder"
    style: dot
    points: [ladder-rule]
    items:
      - {t: "Move up a level only when something specific is breaking, or about to — and name it"}
      - {t: "Drawing L3 for a 100k-user problem is over-engineering"}
      - {t: "The original roadmap's warning: “Kafka and sharding for a system at 50 requests per second”"}
    lines:
      - tom: "The rule of the ladder: you move up a level only when something specific is breaking, and you can name it."
        focus: 0
      - tom: "Drawing microservices for 100k users is over-engineering. The classic mistake: Kafka and sharding for a system at 50 requests per second."
        focus: 2

  - kind: diagram
    chapter: "V1: one machine"
    heading: "V1 · Level L0: one machine"
    sub: "Draw it in 5 minutes — its job is to show every single point of failure"
    points: [l0-spof]
    nodes:
      - {id: u, label: "Mobile / Web", sub: "peak CCU < 50", x: 150, y: 195, w: 220, h: 96, shape: user}
      - {id: vm, label: "One VM", sub: "Spring Boot + PostgreSQL on the same machine", x: 560, y: 195, w: 330, h: 140}
      - {id: s1, label: "SPOF: the machine", x: 990, y: 50, w: 290, h: 58, tone: bad, at: 1}
      - {id: s2, label: "SPOF: the disk", x: 990, y: 145, w: 290, h: 58, tone: bad, at: 2}
      - {id: s3, label: "SPOF: the process", x: 990, y: 240, w: 290, h: 58, tone: bad, at: 3}
      - {id: s4, label: "SPOF: every deploy", x: 990, y: 335, w: 290, h: 58, tone: bad, at: 4}
    edges:
      - {a: u, b: vm, label: "requests"}
      - {a: vm, b: s1, dashed: true, at: 1}
      - {a: vm, b: s2, dashed: true, at: 2}
      - {a: vm, b: s3, dashed: true, at: 3}
      - {a: vm, b: s4, dashed: true, at: 4}
    lines:
      - tom: "V1 is level L0: users on mobile and web talk to one VM that runs both the application and the database."
        say: "V1 is level L zero: users on mobile and web talk to one V M that runs both the application and the database."
        focus: 0
      - tom: "You don't draw it to use it. You draw it to list the single points of failure. The machine."
        focus: 1
      - tom: "The disk."
        focus: 2
      - tom: "The process."
        focus: 3
      - tom: "And every deploy, because a restart is downtime. Each level after this is an answer to one item on this list."
        focus: 4

  - kind: table
    heading: "V1 · the SPOF list: “if it dies, what happens?”"
    columns: ["Single point of failure", "If it dies…", "Removed in V2 by…"]
    widths: [1.4, 3, 2.4]
    build: true
    points: [l0-spof]
    rows:
      - ["The machine", "The app and the database disappear together", "a second app instance + a database standby"]
      - ["The disk", "Committed data is gone: there is no other copy", "a synchronous standby in another AZ"]
      - ["The process", "Everything is down until someone restarts it", "two instances behind a load balancer with health checks"]
      - ["Every deploy", "A release means a restart, and a restart means downtime", "rolling deploys across two instances"]
    lines:
      - tom: "Write each one as a line. If the machine dies, the app and the database disappear together."
        focus: 0
      - tom: "If the disk dies, committed data is gone, because there is no other copy."
        focus: 1
      - tom: "If the process dies, everything is down until someone restarts it. And every release needs a restart, so every deploy is downtime."
        focus: 3
      - tom: "The third column is what V2 must answer, box by box."

  - kind: diagram
    chapter: "V2: 100k users"
    heading: "V2 · Level L1: 100k users — availability first, load later"
    points: [l1-diagram]
    nodes:
      - {id: u, label: "Mobile / Web", sub: "peak CCU 400–1,200", x: 95, y: 195, w: 180, h: 90, shape: user}
      - {id: lb, label: "Load balancer (L7)", sub: "TLS, health checks", x: 315, y: 195, w: 190, h: 80}
      - {id: a1, label: "App 1", sub: "Spring Boot modular monolith", x: 555, y: 105, w: 200, h: 80}
      - {id: pg, label: "PostgreSQL primary", sub: "ledger, transfers", x: 800, y: 195, w: 200, h: 90, shape: db}
      - {id: a2, label: "App 2", sub: "same image, other AZ", x: 555, y: 300, w: 200, h: 80, at: 1}
      - {id: pg2, label: "Standby", sub: "synchronous, other AZ", x: 800, y: 335, w: 200, h: 80, shape: db, at: 2}
      - {id: r, label: "Redis", sub: "sessions, rate limits, hot cache", x: 800, y: 50, w: 200, h: 80, shape: db, at: 3}
      - {id: cdn, label: "CDN", sub: "static files, images, statements", x: 315, y: 50, w: 190, h: 80, at: 4}
      - {id: j, label: "Job queue", sub: "jobs table + SKIP LOCKED", x: 1050, y: 335, w: 200, h: 74, shape: queue, at: 4}
      - {id: w, label: "Worker (same app)", sub: "send email, export statements", x: 1050, y: 195, w: 200, h: 80, at: 4}
      - {id: s3, label: "Object storage", sub: "statement PDFs", x: 1050, y: 50, w: 200, h: 80, shape: db, at: 4}
    edges:
      - {a: u, b: lb}
      - {a: lb, b: a1}
      - {a: a1, b: pg}
      - {a: lb, b: a2, at: 1}
      - {a: a2, b: pg, at: 1}
      - {a: pg, b: pg2, dashed: true, label: "sync replication", at: 2}
      - {a: a1, b: r, at: 3}
      - {a: u, b: cdn, at: 4}
      - {a: pg, b: j, dashed: true, label: "same transaction", at: 4}
      - {a: j, b: w, dashed: true, at: 4}
      - {a: w, b: s3, at: 4}
    lines:
      - tom: "Now V2, level L1, for 100k users. Start with the request path: users, a layer-seven load balancer that ends TLS and runs health checks, one app, and the Postgres primary."
        say: "Now V2, level L one, for one hundred thousand users. Start with the request path: users, a layer-seven load balancer that ends TLS and runs health checks, one app, and the Postgres primary."
        focus: 0
      - tom: "Add a second app instance in another availability zone. That removes the machine and the process from the SPOF list, and it lets you deploy one instance at a time."
        focus: 1
      - tom: "Add a synchronous standby for Postgres in the other zone. That removes the disk: a committed transfer survives losing a whole zone."
        focus: 2
      - tom: "Add Redis for sessions, rate limits and hot data, so the apps stay stateless and the load balancer can send any request to any instance."
        focus: 3
      - tom: "Finally, move slow work off the request path: a CDN for static files, a job queue that is simply a table in Postgres read with SKIP LOCKED, a worker inside the same app, and object storage for statement PDFs."
        focus: 4

  - kind: table
    heading: "V2 · five decisions and their trade-offs"
    columns: ["Decision", "Why", "The trade-off is…"]
    widths: [1.8, 3.4, 2.6]
    points: [l1-decisions]
    rows:
      - ["Modular monolith, not microservices", "200 RPS and one team. Keep module boundaries (account, transfer, notification) enforced with ArchUnit, so splitting later is cheap", "one OOM bug takes down every feature at once"]
      - ["2 instances, though 1 has enough CPU", "If one dies or is being deployed, the other still serves", "double the app cost, in exchange for zero-downtime deploys"]
      - ["Stateless app: session in Redis or a JWT", "The load balancer can send any request to any instance", "one more dependency to monitor"]
      - ["Postgres Multi-AZ (synchronous standby)", "Losing one AZ loses no committed data", "every commit waits one extra cross-AZ round trip, ~1–2 ms"]
      - ["Job queue = a table + SKIP LOCKED", "No Kafka yet; the job and the transfer commit in the same transaction", "no replay, no fan-out to several consumers"]
    lines:
      - tom: "Five decisions, each with its trade-off. A modular monolith, because it's 200 requests per second and one team. Enforce module boundaries with ArchUnit so you can split later. The trade-off: one out-of-memory bug takes down every feature."
        focus: 0
      - tom: "Two instances even though one has enough CPU. You pay double for the app, and you buy deploys without downtime."
        focus: 1
      - tom: "A stateless app with sessions in Redis or a JWT: any request can go anywhere, at the price of one more dependency."
        say: "A stateless app with sessions in Redis or a J W T: any request can go anywhere, at the price of one more dependency."
        focus: 2
      - tom: "Postgres Multi-AZ: no committed data lost with a zone, but every commit waits an extra one to two milliseconds."
        focus: 3
      - tom: "And the job queue as a table: no Kafka yet, and the job commits with the transfer. The trade-off: no replay and no fan-out."
        focus: 4

  - kind: bullets
    heading: "What breaks first on the way to 1M users (× 10)"
    points: [l1-breaks]
    items:
      - {t: "Reads of history and balances all land on the primary"}
      - {t: "Connections: 10 pods × 10 connections = 100 = Postgres's default max_connections"}
      - {t: "Slow work like sending an SMS inside the request makes p99 jump"}
      - {t: "A 15-person team deploying one artifact"}
    lines:
      - tom: "And the question every drawing must answer: what breaks first when load grows ten times? Here: all the reads of history and balances land on the primary."
        focus: 0
      - tom: "Connections: ten pods with ten connections each is 100, exactly Postgres's default max connections."
        say: "Connections: ten pods with ten connections each is one hundred, exactly Postgres's default max connections."
        focus: 1
      - tom: "Slow work, like sending an SMS inside the request, makes the p99 jump. And a 15-person team ends up deploying one artifact. Each of these pushes you to level L2."
        say: "Slow work, like sending an S M S inside the request, makes the p99 jump. And a fifteen-person team ends up deploying one artifact. Each of these pushes you to level L two."
        focus: 3

  - kind: table
    chapter: "Ten drawings"

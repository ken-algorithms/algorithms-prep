  - kind: acronyms
    chapter: "Acronyms in this video"
    heading: "Acronyms in this video (1/2)"
    items:
      - {abbr: SPOF, full: "single point of failure", vi: "điểm chết đơn"}
      - {abbr: VM, full: "virtual machine", vi: "máy ảo"}
      - {abbr: MVP, full: "minimum viable product", vi: "bản sản phẩm nhỏ nhất dùng được"}
      - {abbr: "CCU · RPS", full: "concurrent users · requests per second", vi: "số user cùng lúc · số request mỗi giây"}
      - {abbr: "DB · CPU", full: "database · central processing unit", vi: "cơ sở dữ liệu · bộ xử lý"}
      - {abbr: LB, full: "load balancer", vi: "bộ chia tải tới nhiều instance"}
      - {abbr: "L4 · L7", full: "network layer 4 (transport) · layer 7 (application)", vi: "LB chỉ nhìn IP/port, hay đọc được URL, header"}
      - {abbr: CDN, full: "content delivery network", vi: "máy chủ đặt gần user, giữ bản sao file tĩnh"}
      - {abbr: AZ, full: "availability zone", vi: "một trung tâm dữ liệu độc lập trong region"}
    lines:
      - tom: "SPOF is a single point of failure. A VM is a virtual machine, and an MVP is a minimum viable product. CCU and RPS: concurrent users and requests per second. DB, database, and CPU, the processor."
        say: "SPOF is a single point of failure. A VM is a virtual machine, and an M V P is a minimum viable product. CCU and RPS: concurrent users and requests per second. D B, database, and CPU, the processor."
        focus: 4
      - tom: "LB is a load balancer. Here, L4 and L7 mean network layers four and seven, not scale levels. CDN is a content delivery network, and AZ an availability zone."
        say: "L B is a load balancer. Here, L four and L seven mean network layers four and seven, not scale levels. CDN is a content delivery network, and AZ an availability zone."
        focus: 8
  - kind: acronyms
    heading: "Acronyms in this video (2/2)"
    items:
      - {abbr: TLS, full: "Transport Layer Security", vi: "mã hoá kết nối (HTTPS)"}
      - {abbr: JWT, full: "JSON Web Token", vi: "token có chữ ký chứa thông tin đăng nhập"}
      - {abbr: PDF, full: "portable document format", vi: "file sao kê"}
      - {abbr: OOM, full: "out of memory", vi: "JVM hết heap, process chết"}
      - {abbr: SMS, full: "short message service", vi: "tin nhắn điện thoại"}
      - {abbr: API, full: "application programming interface", vi: "giao diện để chương trình khác gọi vào"}
      - {abbr: C4, full: "the C4 model (4 zoom levels)", vi: "cách vẽ kiến trúc theo 4 mức zoom"}
      - {abbr: "HTTP · gRPC", full: "web protocol · Google's RPC framework", vi: "hai kiểu gọi đồng bộ giữa service"}
      - {abbr: CDC, full: "change data capture", vi: "đọc log thay đổi của DB để phát sự kiện"}
      - {abbr: AWS, full: "Amazon Web Services", vi: "nhà cung cấp cloud"}
      - {abbr: "URL · ID", full: "web address · identifier", vi: "địa chỉ web · mã định danh"}
    lines:
      - tom: "TLS encrypts connections. A JWT is a signed JSON web token. PDF is the statement file format, OOM means out of memory, and SMS is a text message."
        say: "TLS encrypts connections. A JWT is a signed JSON web token. P D F is the statement file format, O O M means out of memory, and S M S is a text message."
        focus: 4
      - tom: "API is an application programming interface. C4 is a way to draw architecture at four zoom levels. HTTP and gRPC are synchronous calls, CDC is change data capture, and AWS is Amazon Web Services. URL and ID: a web address and an identifier."
        say: "API is an application programming interface. C four is a way to draw architecture at four zoom levels. HTTP and g R P C are synchronous calls, C D C is change data capture, and AWS is Amazon Web Services. URL and I D: a web address and an identifier."
        focus: 10

  - kind: bullets
    chapter: "This Sunday's task"
    heading: "This Sunday: V1 and V2 (45 minutes)"
    points: [v1v2-task]
    items:
      - {t: "V1 · 10 minutes: Mini Core Transfer at level L0", s: "list every SPOF, one line each: “if it dies, what happens?”"}
      - {t: "V2 · 20 minutes: the same system at L1, 100k users", s: "write the estimate table from exercise 1.4 on the diagram itself"}
      - {t: "Every box you add must remove one SPOF from V1", s: "write next to the box which one it removes"}
      - {t: "Then compare with 02 §3.1–3.2 and self-grade with the 6 questions", s: "the questions are at the end of this video"}
    lines:
      - tom: "Your task this Sunday. V1, in 10 minutes: the Mini Core Transfer system at level L0, with every single point of failure, one line each: if it dies, what happens?"
        say: "Your task this Sunday. V1, in ten minutes: the Mini Core Transfer system at level L zero, with every single point of failure, one line each: if it dies, what happens?"
        focus: 0
      - tom: "V2, in 20 minutes: the same system at level L1 for 100k users, with the estimate table written on the diagram itself."
        say: "V2, in twenty minutes: the same system at level L one for one hundred thousand users, with the estimate table written on the diagram itself."
        focus: 1

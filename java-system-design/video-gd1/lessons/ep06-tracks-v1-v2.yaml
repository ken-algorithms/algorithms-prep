      - ["V2", "1", "The same app at L1 + the 100k-user estimate on the diagram", "L1", "20'"]
      - ["V3", "2", "Where the rate limiter sits, and how it uses Redis", "L1", "20'"]
      - ["V4", "3", "URL shortener + unique ID generator", "L1→L2", "30'"]
      - ["V5", "4", "Notification system: queues, retries, idempotency, dead letters, per channel", "L2", "30'"]
      - ["V6", "6", "Mini Core Transfer at L2 (1M users)", "L2", "30'"]
      - ["V7", "8–9", "Payment / wallet with Kafka + saga", "L2", "40'"]
      - ["V8", "11", "Split V6 into services: a C4 container diagram", "L2→L3", "40'"]
      - ["V9", "13–14", "Observability + security on top of V8", "L3", "30'"]
      - ["V10", "15–16", "Mini Core Transfer at L3 (10M) on AWS, multi-AZ + disaster recovery", "L3", "45'"]
      - ["Drill", "17–24", "One system, three scales: redraw V2 → V6 → V10 in 45 minutes", "L1→L3", "45'"]
    lines:
      - tom: "V1 and V2 start a series of ten drawings. Each one has a time limit, and you draw it yourself before looking at the model."
      - tom: "Phase one draws V1 to V5: the rate limiter in week two, the URL shortener in week three, the notification system in week four."
        focus: 4
      - tom: "Later come the bank at one million users, a payment saga, splitting services, and finally the bank at ten million users on AWS, V10."
        say: "Later come the bank at one million users, a payment saga, splitting services, and finally the bank at ten million users on AWS, V10."
        focus: 9
      - tom: "And from week 17, the drill: one system, three scales. You redraw V2, V6 and V10 in 45 minutes and explain every change."
        focus: 10

  - kind: bullets
    chapter: "How to draw"
    heading: "Drawing conventions — so others can read your diagram"
    points: [draw-conventions]
    items:
      - {t: "C4 has three levels: Context, Container, Component — interviews need the Container level"}
      - {t: "Solid arrow = synchronous (HTTP, gRPC) · dashed arrow = asynchronous (queue, CDC, replication)"}
      - {t: "Numbers on arrows: “2k RPS”, “p99 50 ms” — an arrow without a number is decoration"}
      - {t: "AZs and regions are enclosing boxes: anything inside only one AZ is a SPOF"}
      - {t: "A cylinder holds state; any other box must be stateless, or say where its state lives"}
      - {t: "Tools: Excalidraw to practise, mermaid in the repo, draw.io at work"}
    lines:
      - tom: "Conventions, so other people can read your drawing. Use the container level of the C4 model: apps, databases, brokers."
        say: "Conventions, so other people can read your drawing. Use the container level of the C four model: apps, databases, brokers."
        focus: 0
      - tom: "A solid arrow is a synchronous call. A dashed arrow is asynchronous: a queue, change data capture, replication. And put a number on every arrow; an arrow without a number is decoration."
        focus: 2
      - tom: "Draw availability zones and regions as boxes around things, so a single point of failure jumps out. Use a cylinder for anything that holds state."
        focus: 4
      - tom: "Practise in Excalidraw, like a whiteboard. Keep mermaid in the repo, and use draw.io at work."
        focus: 5

  - kind: bullets
    heading: "Grade your drawing: six questions"
    points: [self-grade]
    items:
      - {t: "Does it show CCU, RPS and writes per second — and from which assumptions?"}
      - {t: "Does everything that holds state have a copy in another AZ?"}
      - {t: "Can you point to the first bottleneck when load grows × 10?"}
      - {t: "Which boxes does the money flow through — and which box could duplicate or lose it?"}
      - {t: "Is there a box you can't justify with “because X is breaking”? Delete it"}
      - {t: "Did you write “the trade-off is…” for at least 3 decisions?"}
    lines:
      - tom: "Finally, grade every drawing with six questions. One: does it show concurrent users, requests and writes per second, and the assumptions behind them?"
        focus: 0
      - tom: "Two: does everything that holds state have a copy in another zone? Three: can you point to the first bottleneck at ten times the load?"
        focus: 2
      - tom: "Four: which boxes does the money flow through, and which one could duplicate or lose it? Five: is there a box you can't justify? Delete it."
        focus: 4
      - tom: "Six: did you write the trade-off is, for at least three decisions?"
        focus: 5

  - kind: bullets
    chapter: "Week 1 wrap-up"
    heading: "End of week 1: check your deliverables"
    style: check

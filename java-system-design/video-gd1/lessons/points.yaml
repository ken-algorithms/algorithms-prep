sections:
  # ---------- Ep00 · định hướng ----------
  - src: 00-lo-trinh-6-thang.md#mục-tiêu-và-giả-định
    title: "00 · Mục tiêu và giả định"
    points:
      - {id: goal-three, text: "Ba kết quả sau 24 tuần: phỏng vấn 45–60 phút bằng tiếng Anh có số liệu và đánh đổi; công việc: design doc, review kiến trúc và code; bằng chứng: capstone có load test + 2–3 câu chuyện thiết kế thật", expect: ["45", "design doc", "capstone"]}
      - {id: goal-time, text: "Học 10–12 giờ/tuần; chỉ có 5–6 giờ thì giãn thành 9–10 tháng; phỏng vấn trong 6–8 tuần thì làm nhanh giai đoạn 1, dồn sức cho giai đoạn 4", expect: ["10–12 hours", "9–10 months", "6–8 weeks"]}
      - {id: goal-four-steps, text: "Mỗi chủ đề đi 4 bước: đọc, vẽ sơ đồ, chạy demo Java/Spring, giải thích đánh đổi trong 2 phút (bước người phỏng vấn chấm); luyện tiếng Anh từ tháng đầu", expect: ["Draw", "2 minutes", "English"]}
  - src: 00-lo-trinh-6-thang.md#tự-đánh-giá-điểm-xuất-phát
    title: "00 · Tự đánh giá điểm xuất phát"
    points:
      - {id: self-check, text: "14 câu tự đánh giá; dưới 5 ô: đi đủ giai đoạn 1; 5–9 ô: lướt giai đoạn 1; từ 10 ô: vào thẳng giai đoạn 3–4; không bỏ Track P và Track S", expect: ["14", "Fewer than 5", "Never skip"]}
  - src: 00-lo-trinh-6-thang.md#tổng-quan-lộ-trình
    title: "00 · Tổng quan lộ trình"
    points:
      - {id: phases, text: "4 giai đoạn: nền tảng (tuần 1–4), dữ liệu và hệ phân tán (5–10), microservices và cloud (11–16), phỏng vấn và ứng tuyển (17–24)", expect: ["1–4", "5–10", "11–16", "17–24"]}
      - {id: milestones, text: "Mốc: tuần 4 URL shortener + rate limiter trong 45 phút; tuần 10; tuần 16 capstone chạy trên cloud có số load test; tuần 24 CV mới, 6–8 câu chuyện STAR, nộp đơn", expect: ["URL shortener", "STAR", "load-test"]}
      - {id: capstone, text: "Capstone tuần 9–16: bản A ngân hàng (Mini Core Transfer), bản B SaaS", expect: ["9–16", "SaaS"]}
  - src: 00-lo-trinh-6-thang.md#lịch-tuần-mẫu
    title: "00 · Lịch tuần mẫu"
    points:
      - {id: week-rhythm, text: "5 buổi, 10–11 giờ: Thứ Hai đọc (1,5 giờ), Thứ Tư blog + bài tập (1,5 giờ), Thứ Sáu ôn + sổ lỗi + 30 phút Track P (1 giờ), Thứ Bảy lab (3–4 giờ), Chủ nhật Track S + đề bấm giờ + bài nói (3 giờ)", expect: ["Monday", "Saturday", "Sunday", "10–11"]}
  - src: 00-lo-trinh-6-thang.md#giai-đoạn-1--nền-tảng-tuần-14
    title: "00 · Giai đoạn 1"
    points:
      - {id: phase1-table, text: "Bảng giai đoạn 1: tuần 1 ước lượng; tuần 2 networking, API, rate limiter; tuần 3 database sâu, URL shortener, ID generator; tuần 4 caching, nhất quán, notification; kèm cột Track P · Track S", expect: ["rate limiter", "notification", "P18"]}
  - src: 00-lo-trinh-6-thang.md#v2-track-p--code-java-chậm-dưới-tải-cao
    title: "00 · Track P"
    points:
      - {id: trackp-why, text: "Kiến trúc chỉ nhân năng lực của một request; code giữ tài nguyên khan hiếm đặt trần cứng mà thêm pod không phá được (P09: 163 req/s với pool 10)", expect: ["163", "pool"]}
      - {id: trackp-groups, text: "20 anti-pattern chia 4 nhóm: lãng phí mỗi request, giữ tài nguyên khan hiếm, round trip thừa, bộ nhớ; có code và số đo thật", expect: ["20", "4 groups"]}
  - src: 00-lo-trinh-6-thang.md#v2-track-s--vẽ-hệ-thống-từ-100k-tới-10m-users
    title: "00 · Track S"
    points:
      - {id: tracks-why, text: "Đề nói 'N triệu user' mà không nói CCU hay RPS; Track S đổi ra tải thật, chọn bậc kiến trúc, trả lời 'tải tăng 10 lần thì sao'", expect: ["CCU", "ten times|10 times|10×"]}
      - {id: tracks-answer, text: "Trả lời nhanh: 100k → ~1.200 CCU ngày lương, ~200 RPS, L1; 1M → ~12.000, ~2.000, L2; 10M → ~120.000, ~20.000, L3", expect: ["1,200", "12,000", "120,000", "20,000"]}
      - {id: tracks-drawings, text: "10 bản vẽ V1–V10 rải dọc 24 tuần; giai đoạn 1 vẽ V1–V5", expect: ["V1–V10|V1 to V10", "V1–V5"]}
  - src: 10-implement-gd1-nen-tang.md#0-cách-dùng-file-này
    title: "10 §0 · Cách dùng file này"
    points:
      - {id: use-rule, text: "Tự làm bài trước, ghi câu trả lời, rồi mới mở đáp án; đáp án là một lời giải hợp lý, chỗ khác ghi lý do vào sổ lỗi", expect: ["one reasonable", "error log"]}
      - {id: use-folder, text: "Thư mục bài làm my-work/: sổ lỗi, w1-uoc-luong, w2–w4 lab, drawings, recordings", expect: ["my-work"]}
      - {id: use-errlog, text: "Mẫu sổ lỗi: ngày, đề/lab, lỗi, vì sao sai, lần sau làm gì", expect: ["next time"]}
      - {id: use-stack, text: "Stack cho lab: Java 21, Spring Boot 3.3+, PostgreSQL 16, Redis 7, JUnit 5; Testcontainers, không có Docker thì embedded-postgres", expect: ["Java 21", "Testcontainers", "embedded-postgres"]}

  # ---------- Ep01 · bộ đồ nghề ước lượng ----------
  - src: 10-implement-gd1-nen-tang.md#tuần-1--khung-tư-duy-ước-lượng-và-chi-phí-của-một-request
    title: "10 · Tuần 1: đầu ra và tài liệu đọc"
    points:
      - {id: w1-outputs, text: "5 đầu ra cuối tuần 1: bảng ước lượng 3 hệ thống; số JMH của máy mình + bảng nhân với QPS; bản vẽ V1, V2; thuộc bảng latency; bài nói 2 phút", expect: ["JMH", "V1", "latency"]}
      - {id: w1-reading, text: "Đọc: Alex Xu Vol 1 chương 1–3; blog Discord 'How Discord Stores Trillions of Messages'; 01 §1–2 và 02 §1", expect: ["Alex Xu", "Discord"]}
  - src: 10-implement-gd1-nen-tang.md#11-quy-đổi-phải-nhẩm-được
    title: "10 §1.1 · Quy đổi phải nhẩm được"
    points:
      - {id: conv-day, text: "1 ngày = 86.400 s ≈ 10^5 s (sai 16%, đủ cho ước lượng); 1 tháng ≈ 2,5×10^6 s; 1 năm ≈ 3,15×10^7 s", expect: ["86,400", "16%", "3.15"]}
      - {id: conv-rps, text: "1 triệu request/ngày ≈ 12 RPS trung bình; 1 tỷ/ngày ≈ 12.000 RPS", expect: ["12 RPS", "12,000"]}
      - {id: conv-peak, text: "Đỉnh = trung bình × 2–3, hoặc theo tỉ trọng giờ cao điểm 10%/giờ → × 2,4", expect: ["2.4"]}
      - {id: conv-storage, text: "Storage/năm = ghi/giây × byte/bản ghi × 3,15×10^7 × hệ số nhân bản (× 2–3); băng thông = RPS × kích thước response", expect: ["replication", "response size"]}
      - {id: conv-nines, text: "99,9% = 8,8 giờ chết/năm = 43 phút/tháng; 99,99% = 53 phút/năm = 4,3 phút/tháng", expect: ["8.8", "43", "53", "4.3"]}
  - src: 10-implement-gd1-nen-tang.md#12-bảng-latency-bậc-độ-lớn-là-thứ-cần-nhớ-không-phải-chữ-số
    title: "10 §1.2 · Bảng latency"
    points:
      - {id: lat-memory, text: "L1 cache ~1 ns; RAM ~100 ns (100 lần L1); hàm Java nhỏ, cấp phát object 10–100 ns (P01–P06 nằm quanh đây); SSD đọc ngẫu nhiên ~100 µs", expect: ["1 ns", "100 ns", "100 µs"]}
      - {id: lat-network, text: "Round trip cùng AZ 0,5–1 ms (mỗi query trả ít nhất chừng này, P15); khác AZ 1–2 ms (giá của Multi-AZ synchronous commit); bắt tay TCP + TLS 1.3 = 2 × RTT (lý do giữ keep-alive, P08)", expect: ["0.5–1 ms", "Multi-AZ", "keep-alive"]}
      - {id: lat-geo, text: "TP.HCM ↔ Singapore ~30–40 ms; TP.HCM ↔ Sydney ~100–150 ms (NAB: app ở VN gọi hệ thống ở Úc)", expect: ["Singapore", "Sydney", "NAB"]}
      - {id: lat-gc, text: "Một lần dừng GC thế hệ trẻ (G1, heap vài GB): vài ms tới vài chục ms, rơi vào p99", expect: ["G1", "p99"]}
      - {id: lat-caveat, text: "Số mạng và GC là giá trị điển hình, đo lại bằng ping / log GC; dùng để ra quyết định trên bảng, không ghi vào SLA", expect: ["ping", "SLA"]}
  - src: 10-implement-gd1-nen-tang.md#13-littles-law--công-thức-dùng-nhiều-nhất-cả-lộ-trình
    title: "10 §1.3 · Little's Law"
    points:
      - {id: little-def, text: "L = λ × W: L số thứ đang ở trong hệ thống (request, connection, test), λ throughput mỗi giây, W thời gian mỗi thứ ở lại", expect: ["λ", "throughput"]}
      - {id: little-uses, text: "Ba cách dùng: (1) biết λ, W → số worker/connection/pod cần; (2) biết L tối đa (pool) và W → trần throughput; (3) L tăng mà λ không đổi → W tăng, có thứ chậm đi; P09 là cách (2)", expect: ["ceiling", "slower"]}
      - {id: little-p09, text: "Ví dụ P09 (01 §1): pool 10, giữ 60 ms → trần 166 req/s, đo 162,7; giữ 10 ms → 1.000 req/s, đo 928–935; sai số dưới 7%", expect: ["166", "162.7", "928"]}

  # ---------- Ep02 · từ N users ra CCU và RPS ----------
  - src: 02-ve-he-thong-100k-1m-10m.md#0-đọc-file-này-trong-60-giây
    title: "02 §0 · Đọc trong 60 giây"
    points:
      - {id: ts-not-load, text: "'N users' không phải đơn vị tải; đổi qua 4 bước, bỏ bước nào là sai cả bậc độ lớn", expect: ["not a unit of load", "order of magnitude"]}
      - {id: ts-session, text: "CCU phụ thuộc độ dài phiên hơn số user: cùng 1M user, ngân hàng ~4.000, chat ~50.000 (12 lần)", expect: ["4,000", "50,000", "12"]}
      - {id: ts-100k-availability, text: "100k users là bài toán sẵn sàng, không phải bài toán tải: ~200 RPS; vẫn cần 2 instance vì một instance chết là sập", expect: ["availability", "200"]}
      - {id: ts-10m-ledger, text: "10M users ngân hàng: ghi sổ cái vẫn vừa một Postgres primary; thứ không vừa là phần đọc, số team, bán kính sự cố", expect: ["blast radius", "primary"]}
      - {id: ts-bad-code, text: "Code xấu nhân với số máy: mỗi request thêm 2 ms CPU thì ở 10M users trả thêm ~33 pod", expect: ["33"]}
  - src: 02-ve-he-thong-100k-1m-10m.md#1-từ-n-users-ra-ccu-và-rps--công-thức-4-bước
    title: "02 §1 · Công thức 4 bước"
    points:
      - {id: ts-formula, text: "Bước 1 DAU = đăng ký × tỉ lệ hoạt động; bước 2 CCU đỉnh = DAU × phút/ngày × tỉ trọng giờ cao điểm ÷ 60; bước 3 RPS = CCU × request/giây/user; bước 4 ngày đặc biệt × 3 tới × 10", expect: ["÷ 60", "× 3 to × 10"]}
      - {id: ts-why-step2, text: "Vì sao bước 2: tổng user-phút = DAU × phút; giờ cao điểm gánh ~10% (gấp ~2,4 lần trung bình); chia 60 ra số người online cùng lúc", expect: ["user-minutes"]}
      - {id: ts-defaults, text: "Giả định mặc định phải nói to: hồ sơ A (ngân hàng) 30%, 8 phút, 10%, 0,17 req/s, × 3 ngày lương; hồ sơ B (chat) 50%, 60 phút, 10%, 0,05 req/s + 1 WebSocket, × 2", expect: ["0.17", "0.05", "out loud"]}
  - src: 02-ve-he-thong-100k-1m-10m.md#11-bảng-tính-sẵn--hồ-sơ-a-ngân-hàng-đúng-capstone-a
    title: "02 §1.1 · Bảng hồ sơ A"
    points:
      - {id: tA-table, text: "Hồ sơ A 100k/1M/10M: DAU 30k/300k/3M; CCU đỉnh 400/4.000/40.000; ngày lương 1.200/12.000/120.000; RPS đỉnh ~70/~670/~6.700; ngày lương ~200/~2.000/~20.000", expect: ["40,000", "6,700", "20,000"]}
      - {id: tA-writes, text: "~6 ghi DB mỗi giao dịch (2 bút toán, transfer, outbox, khoá idempotency, audit); 10M: ~250 TPS, ~1.500 ghi/s, ~650 GB sổ cái/năm", expect: ["outbox", "1,500", "650"]}
      - {id: tA-worked, text: "Tính một ô: 3.000.000 × 8 × 0,10 ÷ 60 = 40.000; × 0,17 ≈ 6.800, làm tròn ~6.700", expect: ["3,000,000", "6,800"]}

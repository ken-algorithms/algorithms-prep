    title: "01 §2 · Nhóm 1: P01–P07"
    points:
      - {id: p-measure, text: "Đo bằng JMH -prof gc, 3 vòng warm-up + 5 vòng đo, 1 fork; B/op là byte cấp phát mỗi lần gọi", expect: ["warm-up", "B/op"]}
      - {id: p01, text: "P01 tạo lại object đắt: new ObjectMapper() 14,6 µs → 0,48 µs (30×), 19,6 KB → 688 B; cùng họ DateTimeFormatter, Pattern, HTTP client; thread-safe thì dùng chung", expect: ["14.6", "0.48", "thread-safe"]}
      - {id: p02, text: "P02 String.matches compile regex mỗi lần: 429 → 116 ns; precompile Pattern; ReDoS phải sửa regex hoặc giới hạn input", expect: ["429", "ReDoS"]}
      - {id: p03, text: "P03 += trong vòng lặp O(n²): 10.000 dòng 639 ms → 0,35 ms, 2,23 GB rác; StringBuilder hoặc ghi thẳng ra stream", expect: ["639", "StringBuilder"]}
      - {id: p04, text: "P04 exception làm luồng điều khiển: 942 → 8,8 ns; chi phí theo độ sâu stack (stack Spring 100–200 frame); kiểm tra trước", expect: ["942", "stack"]}
      - {id: p05, text: "P05 autoboxing: Map<Integer,Integer>.merge 213 → 6,5 µs; Long total 50 → 3,1 µs, 240 KB rác; escape analysis không gỡ", expect: ["213", "Long"]}
      - {id: p06, text: "P06 dựng chuỗi log khi level tắt: 1.023 ns → ~1 ns; placeholder vẫn gọi describe(); guard isDebugEnabled hoặc Supplier", expect: ["1,023", "isDebugEnabled"]}
      - {id: p07, text: "P07 O(n²) ẩn: list.contains 10.000 phần tử 117 ms → 0,46 ms (255×); LinkedHashSet; hỏi 'n tối đa là bao nhiêu'", expect: ["117", "LinkedHashSet"]}
      - {id: p-read-table, text: "Đọc bảng đúng: P01, P02, P04, P06 vài µs (P01 ở 10k RPS = 0,14 core, dưới 0,2%; rác ~500 MB/s cả cụm) → sửa khi tiện; P03, P05, P07 tăng theo dữ liệu (export 10.000 dòng 0,64 s, 2,2 GB)", expect: ["0.14", "0.64"]}
      - {id: p-blind, text: "Không tối ưu mù: sửa nhóm 1 khi profiler (async-profiler, JFR) chỉ ra hoặc khi nằm trong vòng lặp theo dữ liệu; sửa P01–P07 mà bỏ P09 là sai thứ tự", expect: ["blind", "async-profiler"]}

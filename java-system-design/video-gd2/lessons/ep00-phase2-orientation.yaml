id: ep00-phase2-orientation
ep: 0
week: 0
tag: "EP00 · PHASE 2"
title: "Phase 2 orientation"
subtitle: "Data across many nodes: six weeks, five labs, and the capstone kickoff"
covers:
  - 20-implement-gd2-du-lieu-phan-tan.md#0-trước-khi-bắt-đầu
  - 00-lo-trinh-6-thang.md#giai-đoạn-2--dữ-liệu-và-hệ-phân-tán-tuần-510
scenes:
  - kind: title
    chapter: "Welcome"
    items:
      - {t: "Sources: 20 · §0 (before you start) and 00 · phase 2 (weeks 5–10)"}
      - {t: "Phase 2 · weeks 5–10 · 23 videos, about 9 minutes each"}
    lines:
      - emma: "Hi, I'm Emma. Welcome to phase two of the Java system design roadmap: data and distributed systems, weeks five to ten."
      - emma: "This first video is the map: why this phase matters, what you need before you start, how the six weeks are laid out, and how to use these videos."

  - kind: acronyms
    chapter: "Acronyms in this video"
    heading: "Acronyms in this video"
    items:
      - {abbr: DB, full: "database", vi: "cơ sở dữ liệu"}
      - {abbr: API, full: "application programming interface", vi: "giao diện để chương trình khác gọi vào"}
      - {abbr: KV, full: "key-value (store)", vi: "kho dữ liệu khoá–giá trị"}
      - {abbr: URL, full: "uniform resource locator", vi: "địa chỉ web"}
      - {abbr: CCU, full: "concurrent users", vi: "số user đang dùng cùng một lúc"}
      - {abbr: RPS, full: "requests per second", vi: "số request mỗi giây"}
      - {abbr: 2PC, full: "two-phase commit", vi: "commit hai pha giữa nhiều bên, giữ khoá qua mạng"}
      - {abbr: SHA, full: "Secure Hash Algorithm", vi: "họ hàm băm; SHA-512 dùng để kiểm file tải về"}
      - {abbr: DDIA, full: "Designing Data-Intensive Applications", vi: "sách của Martin Kleppmann, tài liệu đọc chính"}
      - {abbr: KRaft, full: "Kafka Raft", vi: "chế độ Kafka tự bầu controller bằng Raft, không cần ZooKeeper"}
      - {abbr: MVP, full: "minimum viable product", vi: "bản tối thiểu chạy được"}
      - {abbr: ADR, full: "architecture decision record", vi: "một trang ghi một quyết định kiến trúc"}
      - {abbr: JDK, full: "Java Development Kit", vi: "bộ công cụ để biên dịch và chạy Java"}
    lines:
      - emma: "A few short forms first. DB is the database, API is an application programming interface, and KV means key-value, as in a key-value store."
        focus: 2
      - emma: "From phase one: URL, a web address; CCU, concurrent users; and RPS, requests per second. 2PC is two-phase commit, a big topic in week seven. SHA is the Secure Hash Algorithm, used to check a download."
        focus: 7
      - emma: "DDIA is the book Designing Data-Intensive Applications by Martin Kleppmann, your main reading. KRaft is Kafka's own Raft mode, which replaced ZooKeeper."
        focus: 9
      - emma: "MVP is a minimum viable product, an ADR is an architecture decision record, one page per decision, and JDK is the Java Development Kit."
        focus: 12

  - kind: bullets
    chapter: "Why phase 2"
    heading: "Why this phase separates senior from mid-level"
    style: dot
    points: [p2-why, p2-entry]
    items:
      - {t: "Phase 1: one database, one service", s: "estimation, APIs, indexes, isolation, caching"}
      - {t: "Phase 2: many nodes, many services, a flaky network", s: "what happens to the data when something fails in the middle"}
      - {t: "To enter: you passed the week-4 milestone", s: "URL shortener and rate limiter in 45 minutes, CCU and RPS at three scales"}
      - {t: "Two labs you must have done: lab 3A and lab 2", s: "the lost update and the atomic Lua script — phase 2 repeats both ideas across services"}
    lines:
      - emma: "In phase one you mostly had one database and one service. Phase two asks the question that separates senior engineers from mid-level ones: what happens to your data when there are many nodes, many services, and a network that fails in the middle."
        focus: 1
      - emma: "To start, you should have passed the week-four milestone."
        focus: 2
      - emma: "And two labs are mandatory groundwork. Lab 3A, where you reproduced a lost update, and lab 2, the atomic Lua script for the rate limiter. This phase repeats exactly those two ideas, but across several services instead of inside one database."
        focus: 3

  - kind: table
    chapter: "The six weeks"
    heading: "Six weeks at a glance"
    columns: ["Weeks", "Topic", "Lab", "Track P · Track S", "Timed designs"]
    widths: [0.8, 2.4, 2.1, 2.1, 1.9]
    build: true
    points: [p2-map, p2-roadmap]
    rows:
      - ["5–6", "Replication, partitioning, consistent hashing", "5A hash ring · 5B quorum simulation", "P: checklist review · S: V6 at 1M users", "Key-value store, distributed cache"]
      - ["7", "Saga, outbox, idempotency, double-entry ledger", "7: saga with state in Postgres", "P: P09 across a saga · S: sketch V7", "Payment system, digital wallet"]
      - ["8–9", "Kafka in depth", "8: Spring Boot + Kafka + Postgres", "P: P20 · S: V7 with Kafka and a saga", "Ad click aggregation"]
      - ["10", "Consensus, distributed locks, clocks", "10A fencing token · 10B job scheduler", "S: update V6 with lab-8 numbers", "Hotel reservation, job scheduler"]
      - ["9–10", "Capstone kickoff", "Design doc v1, then an MVP skeleton", "", ""]
    lines:
      - emma: "Here are the six weeks. Weeks five and six: replication, partitioning, and consistent hashing, with two labs, a hash ring and a quorum simulation, and drawing V6, your bank at one million users."
        focus: 0
      - emma: "Week seven: distributed transactions. Sagas, the outbox, idempotency, and the double-entry ledger, with a saga lab that stores its state in Postgres."
        focus: 1
      - emma: "Weeks eight and nine: Kafka in depth. The big lab connects Spring Boot, Kafka and Postgres, Track P adds P20, the slow consumer, and you draw V7, a payment system with Kafka and a saga."
        focus: 2
      - emma: "Week ten: consensus, distributed locks and clocks, with a fencing-token lab and an optional job scheduler."
        focus: 3
      - emma: "And in weeks nine and ten the capstone starts: a design doc first, then a skeleton that runs. The roadmap file lists the same weeks with the readings: the DDIA chapters on replication, partitioning, the trouble with distributed systems, and consensus, plus Martin Kleppmann's distributed systems lectures."
        focus: 4

  - kind: flow
    chapter: "One week"
    heading: "The weekly rhythm stays — with two two-week blocks"
    points: [p2-rhythm]
    items:
      - {t: "Mon", s: "reading", f: "DDIA, Alex Xu"}
      - {t: "Wed", s: "blog + theory exercises"}
      - {t: "Fri", s: "review + Track P"}
      - {t: "Sat", s: "lab", f: "block week 1: build · week 2: measure and break"}
      - {t: "Sun", s: "Track S + timed design + 2-minute talk"}
    note: "Blocks: weeks 5–6 and weeks 8–9. The first Saturday builds, the second measures and tries to break it."
    lines:
      - emma: "The weekly rhythm is the same as phase one. Monday is reading. Wednesday is a blog post and theory exercises."
        focus: 1
      - emma: "Friday is review plus Track P. Saturday is the lab."
        focus: 3
      - emma: "And Sunday is Track S, a timed design, and the two-minute talk. New in this phase: two blocks of two weeks, weeks five and six, and weeks eight and nine. In the first week of a block, Saturday is for building. In the second, you measure it and try to break it."
        focus: 4

  - kind: code
    chapter: "Your folders"
    heading: "Your work goes in my-work/"
    points: [p2-folders]
    code: |
      java-system-design/my-work/
      ├── w5-6-hashing/          lab 5A, 5B (plain Java)
      ├── w7-saga/               lab 7 (Spring Boot + Postgres)
      ├── w8-9-kafka-lab/        lab 8 (Spring Boot + Kafka + Postgres)
      ├── w10-coordination/      lab 10
      ├── capstone/
      │   ├── design-doc.md      written in week 9, reviewed in week 10
      │   └── adr/               0001-…md, one decision per file
      └── drawings/V6, V7
    items:
      - {lines: [2, 5], t: "One folder per lab block"}
      - {lines: [6, 8], t: "The capstone design doc and its ADRs"}
      - {lines: [9, 9], t: "Drawings V6 and V7"}
    lines:
      - emma: "Keep using the my-work folder. One folder per lab block: hashing, the saga, the Kafka lab, and coordination."
        focus: 0
      - emma: "The capstone gets its own folder: the design doc you write in week nine, and an ADR folder with one decision per file."
        focus: 1
      - emma: "And your drawings, V6 and V7."
        focus: 2

  - kind: code
    chapter: "Kafka without Docker"
    heading: "Run Kafka without Docker — the exact commands used for the measurements"
    points: [p2-kafka-nodocker]
    code: |
      # download, then compare with the .sha512 file next to it
      curl -O https://downloads.apache.org/kafka/4.1.2/kafka_2.13-4.1.2.tgz
      tar xzf kafka_2.13-4.1.2.tgz && cd kafka_2.13-4.1.2
      # Kafka 4.x is KRaft only: format the storage once
      bin/kafka-storage.sh format --standalone \
          -t "$(bin/kafka-storage.sh random-uuid)" -c config/server.properties
      bin/kafka-server-start.sh config/server.properties     # localhost:9092
    items:
      - {lines: [1, 3], t: "Download the release and check its SHA-512"}
      - {lines: [4, 6], t: "Kafka 4.x is KRaft only: format the storage once, no ZooKeeper"}
      - {lines: [7, 7], t: "One broker on localhost:9092. Postgres runs embedded, also without Docker"}
    lines:
      - emma: "You can run Kafka without Docker. These are exactly the commands used to measure the numbers in this phase. Download the release and check its SHA-512 checksum."
        say: "You can run Kafka without Docker. These are exactly the commands used to measure the numbers in this phase. Download the release and check its S H A five twelve checksum."
        focus: 0
      - emma: "Kafka 4 only runs in KRaft mode, there's no ZooKeeper any more. So you format the storage once."
        focus: 1
      - emma: "Then start one broker on port 9092. Postgres runs embedded, through the embedded-postgres library, so it doesn't need Docker either. If you do have Docker, use Testcontainers for automated tests."
        focus: 2

  - kind: bullets
    chapter: "Capstone and milestone"
    heading: "What you must show at the end of week 10"
    style: check
    points: [p2-milestone-preview]
    items:
      - {t: "Explain without notes, 2 minutes each", s: "replication and failover · quorum · why not 2PC · outbox + idempotent consumer · Kafka delivery · fencing token"}
      - {t: "Lab 8: seven green tests", s: "including the one that reproduces duplicates after a relay crash"}
      - {t: "Lab 7: a saga that recovers after a crash and handles a pivot timeout"}
      - {t: "D20 run, one consumer fixed, numbers before and after"}
      - {t: "Drawings V6 and V7 · six timed designs scored ≥ 7/10"}
      - {t: "Capstone: design doc v1 with all 11 sections + an MVP skeleton that runs"}
    lines:
      - emma: "Here's a preview of the week-ten milestone, so you know where this is going. You explain replication and failover, quorums, why not two-phase commit, the outbox with an idempotent consumer, Kafka's delivery guarantees, and fencing tokens, each in two minutes, without notes."
        say: "Here's a preview of the week-ten milestone, so you know where this is going. You explain replication and failover, quorums, why not two-phase commit, the outbox with an idempotent consumer, Kafka's delivery guarantees, and fencing tokens, each in two minutes, without notes."
        focus: 0
      - emma: "Lab 8 has seven green tests, including one that reproduces duplicates after a relay crash. Lab 7 recovers after a crash and handles a timeout at the pivot step."
        focus: 2
      - emma: "You've run D20 and fixed one consumer. You have drawings V6 and V7, and six timed designs scored at least seven out of ten."
        focus: 4
      - emma: "And the capstone has a first design doc with all eleven sections, plus a skeleton that runs. The final video of this phase goes through every criterion."
        focus: 5

  - kind: bullets
    chapter: "How to use these videos"
    heading: "How to use these videos"
    style: num
    points: [p2-videos]
    items:
      - {t: "One big idea per video, with its own exercises", s: "the order follows file 20, week by week"}
      - {t: "At “Pause the video and try it yourself”, pause", s: "answer first, then compare — one reasonable answer, not the only one"}
      - {t: "Every acronym is on the card at the start", s: "full form in English, a one-line meaning in Vietnamese"}
      - {t: "“Measured” means it was run; “assumption” means a guess", s: "lab numbers come from dist-lab and perf-lab, run on real Postgres 16.4 and Kafka 4.1.2"}
      - {t: "In the Video tab, each key point links to its section", s: "click the time to jump there, click ↳ to open the source"}
    lines:
      - emma: "Finally, how to use these videos. Each one covers one big idea with its own exercises, in the same order as the phase-two guide."
        focus: 0
      - emma: "When you see the countdown, pause the video and answer first. The answer shown is one reasonable answer, not the only one."
        focus: 1
      - emma: "Every acronym is explained on the card at the start of each video."
        focus: 2
      - emma: "When I say measured, the number comes from a real run, on real Postgres 16.4 and Kafka 4.1.2. When I say assumption, it's a guess you should state out loud."
        say: "When I say measured, the number comes from a real run, on real Postgres sixteen point four and Kafka four point one point two. When I say assumption, it's a guess you should state out loud."
        focus: 3
      - emma: "And in the app's Video tab, every key point has a timestamp and a link back to its section. Next episode: replication."
        focus: 4

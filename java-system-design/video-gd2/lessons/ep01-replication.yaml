scenes:
  - kind: title
    chapter: "Intro"
    items:
      - {t: "Sources: 20 · weeks 5–6 (outputs, reading), §5.1 replication models, exercises 5.1 and 5.3"}
      - {t: "Weeks 5–6 · Monday reading + Wednesday exercises"}
    lines:
      - emma: "Episode one. Once your data lives on more than one machine, every write has to reach several copies. How you do that decides what you lose when a machine dies."
      - emma: "We'll look at the three ways to replicate, the price of waiting for a copy, what readers see when copies lag behind, and a failover that hands out the same ID twice."

  - kind: acronyms
    chapter: "Acronyms in this video"
    heading: "Acronyms in this video"
    items:
      - {abbr: DB, full: "database", vi: "cơ sở dữ liệu"}
      - {abbr: AZ, full: "availability zone", vi: "trung tâm dữ liệu độc lập trong một region"}
      - {abbr: RPO, full: "recovery point objective", vi: "lượng dữ liệu tối đa được phép mất khi sự cố"}
      - {abbr: RTT, full: "round-trip time", vi: "thời gian gói tin đi và về"}
      - {abbr: LWW, full: "last-write-wins", vi: "giữ bản có timestamp lớn nhất; bản kia mất im lặng"}
      - {abbr: CRDT, full: "conflict-free replicated data type", vi: "kiểu dữ liệu tự gộp được khi hai bên cùng sửa"}
      - {abbr: ID, full: "identifier", vi: "mã định danh"}
      - {abbr: UUID, full: "universally unique identifier", vi: "mã 128 bit sinh không cần nơi cấp trung tâm"}
      - {abbr: DDIA, full: "Designing Data-Intensive Applications", vi: "sách của Martin Kleppmann"}
      - {abbr: KV, full: "key-value (store)", vi: "kho dữ liệu khoá–giá trị"}
    lines:
      - emma: "DB is the database. An AZ is an availability zone, an independent data center inside a region. RPO, the recovery point objective, is how much data you may lose in a disaster. RTT is round-trip time."
        focus: 3
      - emma: "LWW means last-write-wins: keep the copy with the latest timestamp. A CRDT is a conflict-free replicated data type, a structure that merges by itself."
        focus: 5
      - emma: "ID is an identifier, and a UUID is a universally unique identifier. DDIA is Kleppmann's book, and KV means key-value."
        focus: 9


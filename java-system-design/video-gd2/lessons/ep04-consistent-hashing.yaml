  - kind: code
    chapter: "Build the ring"
    heading: "Lab 5A, step 1: a hash ring with TreeMap"
    sub: "dist-lab · ConsistentHash.java (run it after you write your own)"
    points: [lab5a-ring]
    code: |
      private final TreeMap<Long, String> ring = new TreeMap<>();
      public void add(String node) {
          for (int i = 0; i < vnodes; i++) ring.put(hash(node + "#" + i), node);
      }
      public void remove(String node) {
          for (int i = 0; i < vnodes; i++) ring.remove(hash(node + "#" + i));
      }
      public String nodeFor(String key) {
          SortedMap<Long, String> tail = ring.tailMap(hash(key));
          return tail.isEmpty() ? ring.firstEntry().getValue() : tail.get(tail.firstKey());
      }
      // hash() = first 8 bytes of MD5: the same keys land in the same place on every run
    items:
      - {lines: [1, 1], t: "The ring: a sorted map from position to node"}
      - {lines: [2, 4], t: "Each node is placed at vnodes points: “node-2#0”, “node-2#1”…"}
      - {lines: [8, 11], t: "A key belongs to the first node clockwise; past the end, wrap to the start"}
      - {lines: [12, 12], t: "MD5 makes the measurements repeatable"}
    lines:
      - emma: "Step one, the ring. It's just a TreeMap from a position on the ring to a node name."
        focus: 0
      - emma: "Adding a node puts it at many points: node two hash zero, node two hash one, and so on, once per virtual node."
        focus: 1
      - emma: "To find a key's owner, hash the key and take the first node clockwise. TailMap gives everything from that position onward; if it's empty, you wrap around to the start. CeilingEntry does the same in one call."
        focus: 2
      - emma: "The reference uses the first eight bytes of MD5, so every run puts every key in the same place and the numbers repeat exactly."
        focus: 3


      - emma: "Step two: measure. A million keys, four nodes, then add a fifth. Modulo moves 80% of the keys."
        focus: 0
      - emma: "A ring with a single virtual node per node is badly skewed. The busiest node carries 40.7% instead of 25, the load ratio between busiest and quietest is 6.77, and the new node gets only 9.1% of the keys instead of 20."
        say: "A ring with a single virtual node per node is badly skewed. The busiest node carries forty point seven percent instead of twenty-five, the load ratio between busiest and quietest is six point seven seven, and the new node gets only nine point one percent of the keys instead of twenty."
        focus: 1
      - emma: "Ten virtual nodes: better. A hundred: the ratio drops to 1.11, and adding a node moves 18.9%, almost exactly the ideal share."
        say: "Ten virtual nodes: better. A hundred: the ratio drops to one point one one, and adding a node moves eighteen point nine percent, almost exactly the ideal share."
        focus: 3
      - emma: "And two hundred? Slightly worse than a hundred on spread, 1.19. Hold that thought."
        say: "And two hundred? Slightly worse than a hundred on spread, one point one nine. Hold that thought."

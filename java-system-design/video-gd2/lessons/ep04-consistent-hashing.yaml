        say: "Exercise five point six. Four nodes, a million keys, and you add a fifth. How many keys move with modulo, with a ring of a hundred virtual nodes, and with two hundred fifty-six fixed partitions spread evenly over the nodes?"
      - wait: 5

  - kind: table
    heading: "Answer 5.6"
    columns: ["Method", "Keys moved", "How they move"]
    widths: [1.9, 1.9, 3.8]
    build: true
    points: [ex56]
    rows:
      - ["hash mod N", "~80% (measured 80.0%)", "Almost everything, all at once"]
      - ["Ring, 100 vnodes", "~20% (measured 18.9%)", "Key by key, from every node"]
      - ["256 fixed partitions", "~20%: the new node takes ~51 partitions (256 ÷ 5)", "Whole partitions: easy to track, to throttle, to resume"]
    note: "Kafka, Redis Cluster and Elasticsearch all choose fixed partitions. The price: pick a big enough count on day one."
    lines:
      - emma: "Modulo: about 80%, measured 80.0. The ring with a hundred virtual nodes: about 20%, measured 18.9."
        say: "Modulo: about eighty percent, measured eighty point zero. The ring with a hundred virtual nodes: about twenty percent, measured eighteen point nine."
        focus: 1
      - emma: "With 256 fixed partitions, the new node takes about 51 of them, 256 divided by five, so again about 20% of the keys. But they move as whole partitions, which makes the move easy to track, to throttle, and to resume."
        say: "With two hundred fifty-six fixed partitions, the new node takes about fifty-one of them, two hundred fifty-six divided by five, so again about twenty percent of the keys. But they move as whole partitions, which makes the move easy to track, to throttle, and to resume."
        focus: 2
      - emma: "That's why Kafka, Redis Cluster and Elasticsearch all use fixed partitions. The price: the number of partitions must be large enough from day one."

  - kind: speech
    chapter: "Your 2-minute talk"
    heading: "Model answer — “How does consistent hashing reduce data movement when you add a node?”"
    points: [talk-w56]
    items:
      - {t: "With hash mod N, the owner of a key depends on N, so adding one node reshuffles almost everything: I measured 80% of a million keys moving from four nodes to five."}
      - {t: "Consistent hashing puts nodes and keys on the same ring; a key belongs to the first node clockwise."}
      - {t: "A new node only takes over the arcs just before its own positions, so only its fair share moves, about one over N plus one: 18.9% in my test, against an ideal 20.", say: "A new node only takes over the arcs just before its own positions, so only its fair share moves, about one over N plus one: eighteen point nine percent in my test, against an ideal twenty."}
      - {t: "Each node is placed at many points, virtual nodes, because with a single point the busiest node held 6.8 times the load of the quietest.", say: "Each node is placed at many points, virtual nodes, because with a single point the busiest node held six point eight times the load of the quietest."}
      - {t: "The trade-off: you lose range queries over keys, and someone has to manage the ring map, which is why many systems use a fixed number of partitions instead."}
    lines:
      - read: emma
        focus: 0
      - read: emma
        focus: 1
      - read: emma
        focus: 2
      - read: emma
        focus: 3
      - read: emma
        focus: 4


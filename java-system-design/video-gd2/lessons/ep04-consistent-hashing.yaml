  - kind: acronyms
    chapter: "Acronyms in this video"
    heading: "Acronyms in this video"
    items:
      - {abbr: MD5, full: "Message Digest 5", vi: "hàm băm 128 bit; ở đây chỉ dùng để rải khoá, không dùng cho bảo mật"}
      - {abbr: vnode, full: "virtual node", vi: "một node vật lý đặt nhiều điểm trên vòng băm"}

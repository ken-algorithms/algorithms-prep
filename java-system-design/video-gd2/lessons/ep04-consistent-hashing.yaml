  - kind: bullets
    heading: "Two things the numbers say"
    style: num
    points: [lab5a-lessons]
    items:
      - {t: "Virtual nodes exist to even out the load", s: "1 vnode: one node carries 40.7% (1.6 × ideal), and a new node takes only 9.1% instead of 20%"}
      - {t: "More vnodes is not automatically better in one configuration", s: "200 vnodes spread worse than 100 here (1.19 vs 1.11): with a fixed hash, more vnodes is more even only on average"}
    lines:
      - emma: "Two lessons. First, virtual nodes exist to even out the load. With one point per node, one machine carries one point six times its fair share, and a new machine barely helps."
        focus: 0
      - emma: "Second, more virtual nodes isn't automatically better in one specific configuration. Two hundred spread worse than a hundred here. With a fixed hash function, more points make the spread more even on average, in expectation, not in every single setup. So measure your own."
        focus: 1

  - kind: code
    chapter: "Three replicas"
    heading: "Lab 5A, step 3: replication factor 3"
    points: [lab5a-rf3]
    code: |
      // walk clockwise from the key; collect 3 DIFFERENT physical nodes
      List<String> nodesFor(String key, int n) {
          List<String> out = new ArrayList<>();
          for (String node : clockwiseFrom(hash(key))) {   // wraps around the ring once
              if (!out.contains(node)) out.add(node);      // skip vnodes of a node already chosen
              if (out.size() == n) break;
          }
          return out;
      }
      // test: removing a node changes the replica set ONLY for keys that node held
    items:
      - {lines: [1, 1], t: "Replicas = the next distinct physical nodes clockwise"}
      - {lines: [5, 5], t: "Skip vnodes that belong to a node you already picked"}
      - {lines: [10, 10], t: "The test that proves it"}
    lines:
      - emma: "Step three: three replicas per key. Walk clockwise from the key's position and collect three different physical nodes."
        focus: 0
      - emma: "The trap: the next point on the ring may be another virtual node of a machine you already picked. Skip it, or two of your three replicas live on the same machine."
        focus: 1
      - emma: "And the test that proves it works: removing a node must change the replica set only for keys that node was holding."
        focus: 2

  - kind: exercise
    chapter: "Exercise 5.6"
    n: "5.6"
    q: "A cluster of 4 nodes holds 1 million keys. You add a fifth node. How many keys move with each method?"

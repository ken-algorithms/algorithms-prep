id: ep05-kv-store-cache
ep: 5
week: 5
tag: "EP05 · WEEKS 5–6"
title: "Timed designs: a key-value store and a distributed cache"
subtitle: "Exercise 5.7 and 5.8 — the decision tables, and the deep-dive questions you will get"

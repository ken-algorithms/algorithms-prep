    lines:
      - emma: "Episode seven starts week seven: distributed transactions. A transfer to another bank touches your ledger, a fraud check, and the partner bank. There is no single database that can wrap all of that in one transaction."
      - emma: "So why not use two-phase commit across the services? We'll see what it costs, what replaces it, and how to say it in two minutes."


  - kind: diagram
    chapter: "What 2PC costs"
    heading: "Two-phase commit, in one picture"
    sub: "Phase 1: everyone prepares and holds locks · phase 2: commit only if all said yes"
    nodes:
      - {id: co, label: "Coordinator", sub: "the transfer service", x: 150, y: 160, w: 210, h: 90}
      - {id: a, label: "Ledger DB", sub: "prepared, row locked", x: 640, y: 60, w: 230, h: 70, shape: db}
      - {id: b, label: "Fraud service", sub: "prepared, row locked", x: 640, y: 195, w: 230, h: 70, shape: db}
      - {id: c, label: "Partner bank API", sub: "can't prepare at all", x: 640, y: 330, w: 230, h: 70, tone: bad, at: 2}
      - {id: x, label: "Coordinator dies here", sub: "everyone waits, locks held", x: 150, y: 345, w: 230, h: 80, tone: bad, at: 1}
    edges:
      - {a: co, b: a, label: "prepare? yes"}
      - {a: co, b: b, label: "prepare? yes"}
      - {a: co, b: x, dashed: true, at: 1}
      - {a: co, b: c, label: "prepare?", dashed: true, at: 2}
    lines:
      - emma: "Here's two-phase commit. In phase one, the coordinator asks every participant to prepare. Each one locks the rows it touched and answers yes. In phase two, if everyone said yes, the coordinator tells them all to commit."
        focus: 0
      - emma: "The locks are held on every service, across the network, for both phases. And if the coordinator dies between the phases, the participants are stuck: they can't commit and they can't roll back, so they wait, holding their locks."
        focus: 1
      - emma: "And many of the systems you need can't take part at all. A partner bank's REST API has no prepare step."
        focus: 2

  - kind: stats
    heading: "Why not 2PC between microservices — in numbers"
    points: [no-2pc, saga-tradeoff]
    items:
      - {v: "99.5%", l: "availability of the whole transaction", s: "5 services at 99.9%: availability multiplies", tone: bad}
      - {v: "2 phases", l: "locks held across the network", s: "a dead coordinator leaves participants hanging"}
      - {v: "0", l: "Kafka, most NoSQL, partners' REST APIs", s: "systems that can't join 2PC", tone: warn}
    note: "A saga trades immediate consistency for eventual consistency + compensation — and you must handle the missing isolation yourself."
    lines:
      - emma: "Put a number on it. The transaction succeeds only if every participant is up, so availabilities multiply. Five services at 99.9% each give 99.5% for the whole thing."
        say: "Put a number on it. The transaction succeeds only if every participant is up, so availabilities multiply. Five services at ninety-nine point nine percent each give ninety-nine point five percent for the whole thing."
        focus: 0
      - emma: "Locks are held over the network for two phases, and a dead coordinator leaves everyone hanging."
        focus: 1
      - emma: "And Kafka, most NoSQL stores and partners' REST APIs can't join two-phase commit at all."
        focus: 2
      - emma: "So we use a saga instead. A saga trades immediate consistency for eventual consistency plus compensation, undoing completed steps when a later one fails. The catch: there's no isolation between sagas, so you have to handle that yourself."

  - kind: table
    chapter: "Orchestration or choreography"
    heading: "7.2 · Orchestration or choreography?"
    columns: ["", "Orchestration", "Choreography"]
    widths: [1.6, 3.1, 3.1]
    build: true
    points: [orch-chor]
    rows:
      - ["Who's in control", "One orchestrator sends commands, receives replies, stores the state", "Each service listens to events and does its own step"]
      - ["Where you see the flow", "In one place: the saga state table", "Spread over all services; rebuilt from logs and traces"]
      - ["Good for", "Money flows with many steps and exact compensation (interbank transfer)", "Simple fan-out with little compensation (notifications, read models)"]
      - ["Risk", "The orchestrator becomes a “god service”", "Event loops; hard to tell where a saga is"]
    lines:
      - emma: "Two ways to run a saga. With orchestration, one orchestrator sends commands, receives replies, and stores the saga's state. With choreography, each service listens for events and does its own step."
        focus: 0
      - emma: "With an orchestrator you see the whole flow in one place, the saga state table. With choreography it's spread across services, and you rebuild it from logs and traces."
        focus: 1
      - emma: "So orchestration fits money flows with many steps and exact compensation, like an interbank transfer. Choreography fits simple fan-out with little to undo, like notifications and read models."
        focus: 2
      - emma: "The risks: an orchestrator can grow into a god service, and choreography can create loops of events where nobody knows where a saga is."
        focus: 3

  - kind: flow
    chapter: "Three kinds of steps"
    heading: "7.3 · Three kinds of steps — and the only safe order"
    points: [step-types]
    items:
      - {t: "Compensatable", s: "has an undo: hold money ↔ release it", f: "first"}
      - {t: "Pivot", s: "the point of no return: send to the partner bank, charge a card", f: "exactly one"}
      - {t: "Retriable", s: "after the pivot; guaranteed to succeed if retried: final ledger entries, notification", f: "last"}
    note: "Put a step that can fail after the pivot, and you have built a state you can't compensate."
    lines:
      - emma: "Every saga step is one of three kinds. A compensatable step has an undo: holding money, and releasing it."
        focus: 0
      - emma: "The pivot is the point of no return. Once the instruction has gone to the partner bank, or the card has been charged, the saga must go all the way to the end."
        focus: 1
      - emma: "And retriable steps come after the pivot. They're guaranteed to succeed if you retry them enough: writing the final ledger entries, sending the notification."
        focus: 2
      - emma: "So the only safe order is compensatable, then the pivot, then retriable. Put a step that can fail after the pivot, and you've built a state you can't undo."

  - kind: bullets
    heading: "Sagas have no isolation — three countermeasures"
    style: num
    points: [isolation-counter]
    items:
      - {t: "Semantic lock", s: "a PENDING state or a hold on the money tells other flows a saga is running"}
      - {t: "Commutative updates", s: "add and subtract instead of overwriting a value"}
      - {t: "Reread before you write", s: "check the value again before the step that depends on it"}
    lines:
      - emma: "Because there's no isolation, other requests can see a saga half-way through. Three countermeasures. A semantic lock: a pending state, or money on hold, that tells other flows a saga is running."
        focus: 0
      - emma: "Commutative updates: add and subtract instead of overwriting, so the order of two sagas doesn't matter."
        focus: 1
      - emma: "And reread the value right before the step that depends on it."
        focus: 2

  - kind: speech
    chapter: "Your 2-minute talk"
    heading: "Model answer — “Why wouldn't you use two-phase commit between microservices?”"
    points: [talk-w7]
    items:
      - {t: "Two-phase commit holds locks on every participant for both phases, across the network."}
      - {t: "If the coordinator dies between the phases, participants hang with their locks held until it comes back."}
      - {t: "Availability multiplies: five services at 99.9% give 99.5% for the transaction.", say: "Availability multiplies: five services at ninety-nine point nine percent give ninety-nine point five percent for the transaction."}
      - {t: "And Kafka, most NoSQL stores and partners' REST APIs can't take part in it anyway."}
      - {t: "So I use a saga: short local transactions, an outbox to publish events reliably, and idempotency at every step so retries are safe."}
      - {t: "The trade-off is isolation: other requests can see a saga in progress, so I keep a PENDING state on the money, and I reconcile with the partner every day."}
    lines:
      - read: emma
        focus: 0
      - read: emma
        focus: 1
      - read: emma
        focus: 2
      - read: emma
        focus: 3
      - read: emma
        focus: 4
      - read: emma
        focus: 5

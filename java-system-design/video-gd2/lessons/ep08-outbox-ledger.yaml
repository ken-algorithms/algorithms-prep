scenes:
  - kind: title
    chapter: "Intro"
    items:
      - {t: "Sources: 20 · §7.4 dual write and outbox, §7.5 idempotency at three layers, §7.6 the double-entry ledger; exercise 7.6"}
      - {t: "Week 7 · Wednesday theory"}
    lines:
      - emma: "Episode eight: three ideas that every saga depends on. The outbox, so an event is published if and only if the data was saved. Idempotency, so a message that arrives twice has one effect. And the double-entry ledger, so you can prove the money adds up."

  - kind: acronyms
    chapter: "Acronyms in this video"
    heading: "Acronyms in this video"
    items:
      - {abbr: DB, full: "database", vi: "cơ sở dữ liệu"}
      - {abbr: CDC, full: "change data capture", vi: "đọc thay đổi từ log của DB để phát sự kiện"}
      - {abbr: WAL, full: "write-ahead log", vi: "nhật ký ghi trước của Postgres"}
      - {abbr: API, full: "application programming interface", vi: "giao diện để chương trình khác gọi vào"}

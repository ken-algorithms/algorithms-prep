  - kind: table
    chapter: "Five steps"
    heading: "The saga: five steps, in the only safe order"
    columns: ["#", "Step", "Kind", "Compensation"]
    widths: [0.5, 4.0, 1.7, 1.6]
    build: true
    points: [lab7-steps]
    rows:
      - ["1", "Hold the money: available −= x, held += x", "Compensatable", "Release it"]
      - ["2", "Fraud and limit check", "Compensatable (read-only)", "Nothing to undo"]
      - ["3", "Send to the partner bank, with an idempotency key", "Pivot", "—"]
      - ["4", "Post the ledger: held −= x, two entries", "Retriable", "—"]
      - ["5", "Send the notification", "Retriable", "—"]
    lines:
      - emma: "Step one holds the money: it moves the amount from available to held. Its compensation releases it."
        focus: 0
      - emma: "Step two is the fraud and limit check. It only reads, so there's nothing to undo."
        focus: 1
      - emma: "Step three sends the instruction to the partner bank, with an idempotency key. This is the pivot. After it, the saga must finish."
        focus: 2
      - emma: "Steps four and five are retriable: post the two ledger entries and clear the hold, then send the notification. Retried until they succeed."
        focus: 4

  - kind: bullets
    chapter: "The rules"
    heading: "Mandatory: what makes it survive a crash"
    style: check
    points: [lab7-must]
    items:
      - {t: "A table saga_instance(id, type, state, current_step, payload jsonb, version, updated_at)"}
      - {t: "Each step = its own transaction, updating current_step in the same transaction as the step's side effect", s: "and never call the partner inside a transaction (P09)"}
      - {t: "A recovery job every 10 seconds", s: "any saga not in a final state with updated_at older than 30 seconds is resumed from current_step — so every step must be safe to run twice"}
      - {t: "A timeout at step 3 is never compensated blindly", s: "the result is unknown: ask the partner with the idempotency key; compensate only if they confirm “not received”"}
    lines:
      - emma: "Four rules make it survive a crash. First, a saga instance table: ID, type, state, current step, the payload as JSON, a version for optimistic locking, and an updated-at timestamp."
        focus: 0
      - emma: "Second, each step runs in its own transaction, and updates the current step in the same transaction as its side effect. And never call the partner inside a transaction: that's P09 from phase one."
        focus: 1
      - emma: "Third, a recovery job runs every ten seconds. Any saga that isn't finished and hasn't moved for thirty seconds is resumed from its current step. That's why every step must be safe to run twice."
        focus: 2
      - emma: "Fourth, a timeout at step three is never compensated blindly. The result is unknown. Ask the partner using the idempotency key, and compensate only if they confirm they never received it."
        focus: 3

  - kind: code
    heading: "The state table and the recovery query"
    points: [lab7-must]
    code: |
      create table saga_instance(
          id           uuid primary key,
          type         text not null,          -- 'interbank-transfer'
          state        text not null,          -- RUNNING, COMPENSATING, UNKNOWN, COMPLETED, COMPENSATED
          current_step int  not null,
          payload      jsonb not null,
          version      bigint not null,        -- optimistic lock between the job and a live run
          updated_at   timestamptz not null);

      -- recovery job, every 10 s: resume what got stuck
      select id from saga_instance
       where state not in ('COMPLETED', 'COMPENSATED')
         and updated_at < now() - interval '30 seconds';
    items:
      - {lines: [5, 5], t: "current_step moves in the same transaction as the step's effect"}
      - {lines: [7, 7], t: "version: the job and a live run can't both advance one saga"}
      - {lines: [10, 13], t: "Stuck = not final and silent for 30 s → resume from current_step"}
    lines:
      - emma: "Here's a sketch of the table. Current step moves in the same transaction as the step's own effect, so after a crash it always points at the first step that hasn't happened."
        focus: 0
      - emma: "The version column stops the recovery job and a live run from advancing the same saga at once."
        focus: 1
      - emma: "And the recovery query: anything not in a final state, with nothing written for thirty seconds, gets resumed from its current step."
        focus: 2

  - kind: table
    chapter: "Six tests"
    heading: "Lab 7: the six tests"
    columns: ["Test", "Assert"]
    widths: [4.6, 3.4]
    build: true
    points: [lab7-tests]
    rows:
      - ["happyPath", "COMPLETED; the ledger has 2 entries summing to 0; held = 0"]
      - ["fraudRejects_releasesHold", "step 2 rejects → step 1 is compensated; available is back"]
      - ["partnerRejects_compensatesInReverse", "step 3 says “rejected” → compensate 2, then 1, in that order"]
      - ["partnerTimeout_queriesBeforeCompensating", "timeout at step 3, but the partner did receive it → the saga continues, no compensation"]
      - ["crashAfterStep3_recoveryResumes", "kill it after step 3 → recovery resumes; step 3 is not sent twice"]
      - ["duplicateCommand_singleSaga", "the same idempotency key sent twice → one saga"]
    lines:
      - emma: "Six tests. The happy path ends completed, with two ledger entries that sum to zero, and nothing left on hold."
        focus: 0
      - emma: "If the fraud check rejects, step one is compensated and the money is available again. If the partner rejects, compensate step two, then step one, in reverse order."
        focus: 2
      - emma: "The one interviewers love: a timeout at step three when the partner actually received it. The saga must ask, find out it went through, and continue. No compensation."
        focus: 3
      - emma: "Crash right after step three: the recovery job resumes the saga, and step three is not sent a second time. And the same command sent twice with one idempotency key creates exactly one saga."
        focus: 5

  - kind: code
    chapter: "The core, already run"
    heading: "The core idea, run in dist-lab (in memory, not yet persisted)"
    sub: "dist-lab · Saga.java — the state table, recovery and pivot timeout are your part"
    points: [lab7-core]
    code: |
      public static Outcome execute(List<Step> steps) {
          List<String> log = new ArrayList<>();
          Deque<Step> done = new ArrayDeque<>();
          for (Step s : steps) {
              try {
                  s.run(); done.push(s); log.add("OK   " + s.name());
              } catch (RuntimeException e) {
                  log.add("FAIL " + s.name() + ": " + e.getMessage());
                  while (!done.isEmpty()) { Step c = done.pop(); c.compensate(); log.add("UNDO " + c.name()); }
                  return new Outcome(Status.COMPENSATED, log);
              }
          }
          return new Outcome(Status.COMPLETED, log);
      }
    items:
      - {lines: [6, 6], t: "Each finished step goes on a stack"}
      - {lines: [9, 9], t: "On failure, pop: compensate in reverse order"}
    lines:
      - emma: "The reference in dist-lab proves just the core: run the steps in order, and push each finished one onto a stack."
        focus: 0
      - emma: "When a step fails, pop the stack, so compensations run in reverse order."
        focus: 1


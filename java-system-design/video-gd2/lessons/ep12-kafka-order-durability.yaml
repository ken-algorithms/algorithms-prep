      - {t: "Candidates: eventId, accountId, customerId"}
      - {t: "One customer can have many accounts"}
    lines:
      - emma: "Exercise 8.1. A topic of account events: opened, locked, limit updated, transactions. Key by event ID, account ID, or customer ID? Remember that one customer can have many accounts."
        say: "Exercise eight point one. A topic of account events: opened, locked, limit updated, transactions. Key by event ID, account ID, or customer ID? Remember that one customer can have many accounts."
      - wait: 5

  - kind: compare
    heading: "Answer 8.1 — key by accountId"
    points: [ex81]
    items:
      - {title: "accountId", tone: ok, lines: ["The order that matters is within one account", "A lock must arrive before the transaction it rejects"]}
      - {title: "eventId", tone: bad, lines: ["Spreads perfectly", "But loses all ordering"]}
      - {title: "customerId", tone: warn, lines: ["Keeps more order than you need", "Hot partitions: a business customer can have thousands of accounts"]}
    lines:
      - emma: "Account ID. The order that matters is inside one account: a lock event must arrive before the transaction it rejects."
        focus: 0
      - emma: "Event ID spreads perfectly, but you lose all ordering."
        focus: 1
      - emma: "And customer ID keeps more order than you need, and creates a hot partition for a business customer with thousands of accounts."
        focus: 2

  - kind: exercise
    chapter: "Exercise 8.2"
    n: "8.2"
    q: "Settings for money: data may be lost only if 2 brokers die at once."
    items:
      - {t: "List the topic, producer and broker settings"}
      - {t: "Explain why acks=all on its own is not enough"}
    lines:
      - emma: "Exercise 8.2. Which producer and topic settings make data loss require two brokers dying at once? And why isn't acks equals all enough on its own?"
        say: "Exercise eight point two. Which producer and topic settings make data loss require two brokers dying at once? And why isn't acks equals all enough on its own?"
      - wait: 6

  - kind: code
    heading: "Answer 8.2 — the settings for money"
    points: [ex82]
    code: |
      # topic
      replication.factor=3
      min.insync.replicas=2
      # producer
      acks=all
      enable.idempotence=true          # the default
      delivery.timeout.ms=120000       # finite, and handle the send error
      # broker
      unclean.leader.election.enable=false
    items:
      - {lines: [2, 3], t: "Three copies; a write needs at least two in the ISR"}
      - {lines: [5, 7], t: "Wait for the ISR; a send that can't succeed fails within a bound time"}
      - {lines: [9, 9], t: "Never elect a replica that fell behind"}
    lines:
      - emma: "On the topic: three replicas, and minimum in-sync replicas two."
        focus: 0
      - emma: "On the producer: acks equals all, idempotence on, which is the default, and a finite delivery timeout, with code that handles the send error."
        focus: 1
      - emma: "On the broker: unclean leader election disabled."
        focus: 2
      - emma: "Why isn't acks equals all enough? It means every replica in the ISR, the in-sync set. If the ISR shrinks to just the leader, acks equals all behaves exactly like acks equals one."
      - emma: "Minimum in-sync replicas two makes the producer get an error instead of writing a single copy. Next episode: delivery guarantees, consumer groups, and dead letters."

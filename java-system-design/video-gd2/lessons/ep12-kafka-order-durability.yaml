  - kind: diagram
    chapter: "Ordering"
    heading: "8.1 · Order exists only inside one partition"
    sub: "Same key → same partition → same order. Choose the key = the thing that needs order"
    points: [kafka-order]
    nodes:
      - {id: p, label: "Producer", sub: "key = account_id", x: 120, y: 160, w: 190, h: 80}
      - {id: p1, label: "Partition 1", sub: "acct-42: opened, locked, txn rejected", x: 560, y: 80, w: 300, h: 70, shape: queue}
      - {id: p3, label: "Partition 3", sub: "acct-7: opened, limit changed", x: 560, y: 230, w: 300, h: 70, shape: queue}
      - {id: c1, label: "Consumer A", sub: "sees acct-42 in order", x: 1030, y: 80, w: 200, h: 70}
      - {id: c3, label: "Consumer B", sub: "sees acct-7 in order", x: 1030, y: 230, w: 200, h: 70}
      - {id: p5, label: "Partition 5 (added later)", sub: "the modulo changed: new acct-42 events land here", x: 380, y: 355, w: 400, h: 76, tone: bad, at: 1}
    edges:
      - {a: p, b: p1, label: "acct-42"}
      - {a: p, b: p3, label: "acct-7"}
      - {a: p1, b: c1}
      - {a: p3, b: c3}
      - {a: p, b: p5, label: "after the resize", dashed: true, at: 1}
    lines:
      - emma: "Kafka keeps order only inside one partition. Events with the same key go to the same partition, so they're read in the order they were written. So choose the key to be the thing that needs ordering: the account ID for account events."
        focus: 0
      - emma: "Now add partitions. The partition is the hash of the key modulo the number of partitions, so that number just changed. New events for account forty-two land in a new partition, while older ones are still waiting in the old one. During the move, order breaks."
        focus: 1
      - emma: "So choose enough partitions up front, based on the largest number of consumers you expect."
        focus: 1

  - kind: table
    chapter: "Durable writes"
    heading: "8.2 · When can a written message still be lost?"
    columns: ["Setting", "You lose data when…"]
    widths: [4.2, 3.4]
    build: true
    points: [kafka-durability]
    rows:
      - ["acks=1", "the leader writes, then dies before a follower copies it"]
      - ["acks=all, replication.factor=3, min.insync.replicas=2", "2 of 3 brokers die at the same time — the standard setting for money"]
      - ["… and unclean.leader.election.enable=false (default)", "never by electing a lagging replica: Kafka stops accepting writes rather than lose them"]
    lines:
      - emma: "When is a message safe? With acks equals one, the producer gets its answer as soon as the leader has written it. If the leader dies before a follower copies it, it's gone."
        focus: 0
      - emma: "With acks equals all, three replicas, and minimum in-sync replicas two, you lose data only if two of the three brokers die at the same time. That's the standard setting for money."
        say: "With acks equals all, three replicas, and minimum in-sync replicas two, you lose data only if two of the three brokers die at the same time. That's the standard setting for money."
        focus: 1
      - emma: "And keep unclean leader election disabled, which is the default. Then a replica that has fallen behind is never made leader. Kafka would rather stop accepting writes than lose them."
        focus: 2

  - kind: compare
    heading: "The idempotent producer: on by default since Kafka 3.0"
    points: [idem-producer]
    items:
      - {title: "What it stops", tone: ok, lines: ["Duplicates from the producer's own retries", "The broker drops a resent batch it already has"]}
      - {title: "What it does not stop", tone: warn, lines: ["An outbox relay that dies after sending and runs again", "That's a new send, from the broker's point of view", "→ consumers still need idempotency"]}
    lines:
      - emma: "Since Kafka 3.0 the idempotent producer is on by default. When the producer retries a batch, the broker recognises it and drops the duplicate."
        say: "Since Kafka three point oh the idempotent producer is on by default. When the producer retries a batch, the broker recognises it and drops the duplicate."
        focus: 0
      - emma: "But it only covers the producer's own retries. If your outbox relay sends a batch, dies before marking it, and runs again, that's a brand new send. So consumers still need to be idempotent."
        focus: 1

  - kind: exercise
    chapter: "Exercise 8.1"
    n: "8.1"
    q: "Which key for the topic account.events?"
    items:

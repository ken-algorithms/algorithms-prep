  - kind: flow
    chapter: "Step 7 · Break the order"
    heading: "Step 7 · Two relays in parallel: no duplicates, but no order either"
    points: [lab8-order]
    items:
      - {t: "Relay B", s: "claims rows 101–200"}
      - {t: "Relay C", s: "claims rows 201–300"}
      - {t: "C finishes first", s: "its batch reaches Kafka before B's"}
      - {t: "acct-42 out of order", s: "event 250 arrives before event 150 → the order test can go red", tone: bad}
    note: "SKIP LOCKED stops double sending. It does not keep the order."
    lines:
      - emma: "Step seven: break it on purpose. Run two relays in parallel and rerun the order test. Relay B claims rows one hundred one to two hundred, and relay C claims two hundred one to three hundred."
        focus: 1
      - emma: "C finishes first, so its batch reaches Kafka before B's. If account forty-two has an event in each batch, the later event arrives first, and the order test can go red."
        focus: 3
      - emma: "Skip locked stops double sending. It doesn't keep the order."

  - kind: table
    heading: "Three ways to keep the order — write them in your bug log"
    columns: ["Fix", "How", "Cost"]
    widths: [2.4, 4.4, 2.6]
    build: true
    points: [lab8-order-fix]
    rows:
      - ["One relay only", "a leader lock: a Postgres advisory lock, or ShedLock", "no parallel relays"]
      - ["Split the outbox", "hash(key) mod K parts, one relay per part", "K relays to run"]
      - ["Accept the disorder", "the consumer checks a version per account and handles events out of order", "logic in every consumer"]
    lines:
      - emma: "Write three fixes in your bug log. One: run only one relay, elected with a leader lock, a Postgres advisory lock or ShedLock."
        focus: 0
      - emma: "Two: split the outbox by the hash of the key mod K, with one relay per part. Order is kept per key, and you still get K relays."
        focus: 1
      - emma: "Three: let the consumer accept events out of order, using a version number per account."
        focus: 2

  - kind: exercise
    chapter: "Exercise 8.3"
    n: "8.3"
    q: "Count the duplicates. The relay sends a batch of 100 messages every 200 ms. A deploy kills it about 3 times a day, each time right after it sent a batch. How many duplicates a day? And if the consumer isn't idempotent, what does the customer get?"
    items:
      - {t: "Use the lab's number: one crash after one batch"}
    lines:
      - emma: "Exercise 8.3. The relay sends a batch of a hundred messages every two hundred milliseconds. Deploys kill it about three times a day, each time right after it sent a batch. How many duplicates a day? And if the consumer isn't idempotent, what does the customer get?"
        say: "Exercise eight point three. The relay sends a batch of a hundred messages every two hundred milliseconds. Deploys kill it about three times a day, each time right after it sent a batch. How many duplicates a day? And if the consumer isn't idempotent, what does the customer get?"
      - wait: 6

  - kind: stats
    heading: "Answer 8.3 — smaller batches shrink the number; only idempotency removes the harm"
    points: [ex83]
    items:
      - {v: "≤ 300 a day", l: "100 × 3 crashes", s: "the lab measured exactly 100 for one crash", tone: warn}
      - {v: "300 × 2", l: "“You just sent money” notifications", s: "if the consumer isn't idempotent", tone: bad}
      - {v: "posted twice", l: "if that consumer is the ledger", s: "the money itself is wrong", tone: bad}
    lines:
      - emma: "At most a hundred times three: three hundred duplicate messages a day. The lab measured exactly a hundred for one crash."
        focus: 0
      - emma: "Without an idempotent consumer, three hundred customers get their notification twice. Worse, if the consumer is the ledger, those transfers are posted twice."
        focus: 2
      - emma: "Smaller batches only reduce the number of duplicates. Only idempotency removes the harm."

  - kind: bullets
    chapter: "2-minute talk"
    heading: "2-minute talk: “How do you get exactly-once processing with Kafka and a database?”"
    style: check
    points: [talk-w89]
    items:
      - {t: "Kafka transactions only cover what stays inside Kafka"}
      - {t: "With a DB: at-least-once + dedup by event_id in the same transaction as the effect; commit the offset after"}
      - {t: "On the sending side: an outbox"}
      - {t: "The lab's numbers: 1,100 messages, 1,000 applied"}
      - {t: "The trade-off: one more DB write per message; the dedup table must be cleaned up over time"}
    lines:
      - emma: "The two-minute talk: how do you get exactly-once processing with Kafka and a database? Say that Kafka transactions only cover what stays inside Kafka."
        focus: 0
      - emma: "With a database, it's at-least-once delivery plus deduplication by event ID, in the same transaction as the side effect, and the offset committed after. On the sending side, an outbox."
        focus: 2
      - emma: "Quote the lab: eleven hundred messages, a thousand applied. And the trade-off: one more database write per message, and a dedup table you must clean up over time. Next episode: P20, the slow consumer and the rebalance storm."
        focus: 4

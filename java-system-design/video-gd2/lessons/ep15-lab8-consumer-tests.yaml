  - kind: code
    chapter: "Step 4 · Consumer"
    heading: "Step 4 · Dedup and the effect, in one transaction"
    points: [lab8-consumer]
    code: |
      @KafkaListener(topics = "transfer.completed")
      @Transactional
      public void on(ConsumerRecord<String, String> r) {
          UUID eventId = UUID.fromString(header(r, "event-id"));
          int inserted = jdbc.update(
              "insert into processed_event(event_id) values (?) on conflict do nothing", eventId);
          if (inserted == 0) return;                // seen before: a duplicate, skip it
          jdbc.update("insert into notification(transfer_id, account_id, body) values (?, ?, ?)",
                  transferId(r), accountId(r), "You just sent money");
      }
      // the DB commits first; Spring Kafka commits the offset after the listener returns
    items:
      - {lines: [4, 6], t: "Record the event ID; on conflict do nothing"}
      - {lines: [7, 7], t: "0 rows inserted → already applied → skip"}
      - {lines: [8, 9], t: "1 row inserted → apply the effect, same transaction"}
      - {lines: [11, 11], t: "Offset commit after the DB commit"}
    lines:
      - emma: "Step four, the consumer. In one database transaction, insert the event ID into processed event, with on conflict do nothing."
        focus: 0
      - emma: "If no row was inserted, this event was applied before. It's a duplicate, so skip it."
        focus: 1
      - emma: "If one row was inserted, apply the effect, here a notification, in the same transaction. Either both are saved or neither is."
        focus: 2
      - emma: "And the offset is committed after the database commit. That's Spring Kafka's default: it commits after the listener returns. Crash in between, and the message comes back, finds its event ID, and is skipped."
        focus: 3

  - kind: code
    chapter: "Step 5 · Retry and DLT"
    heading: "Step 5 · Three tries, then the dead-letter topic"
    points: [lab8-dlt]
    code: |
      @Bean
      DefaultErrorHandler errorHandler(KafkaTemplate<String, String> template) {
          var recoverer = new DeadLetterPublishingRecoverer(template);  // → <topic>.DLT + error headers
          var handler = new DefaultErrorHandler(recoverer, new FixedBackOff(1000, 2));
          handler.addNotRetryableExceptions(JsonProcessingException.class);  // broken JSON: DLT at once
          return handler;
      }
    items:
      - {lines: [3, 3], t: "Failed records go to <topic>.DLT, with headers that describe the error"}
      - {lines: [4, 4], t: "1 second apart, 2 retries: 3 failures → DLT"}
      - {lines: [5, 5], t: "Will never succeed → not retryable → straight to the DLT"}
    lines:
      - emma: "Step five, retries and the dead-letter topic. A dead-letter publishing recoverer sends failed records to the topic's DLT, by default the topic name plus dot DLT, with headers describing the error."
        say: "Step five, retries and the dead-letter topic. A dead-letter publishing recoverer sends failed records to the topic's D L T, by default the topic name plus dot D L T, with headers describing the error."
        focus: 0
      - emma: "The default error handler retries with a fixed backoff: one second apart, two retries. After three failures, the record goes to the DLT."
        focus: 1
      - emma: "And separate the errors that will never succeed. Broken JSON is registered as not retryable, so it goes straight to the DLT instead of wasting three tries."
        focus: 2


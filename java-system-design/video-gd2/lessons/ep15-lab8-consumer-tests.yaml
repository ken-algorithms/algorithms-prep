      - ["idempotentConsumer_\nappliesEachEventOnce", "read the whole topic, duplicates included → notifications = transfers, skipped = duplicates", "applied 1,000, skipped 100"]
      - ["twoRelaysWithSkipLocked_\ndoNotDoublePublish", "two relays in parallel on the rest → sent = rows left", "800 / 800"]
      - ["ledgerInvariantsHold", "exercise 7.6's queries return nothing; the total balance is unchanged", "sum(ledger) = 0, total 100,000,000"]
    lines:
      - emma: "Step six, seven tests. The first makes the relay throw after sending and before marking. The topic then holds more messages than the outbox has rows. The reference measured a thousand rows and eleven hundred messages."
        focus: 0
      - emma: "The second reads the whole topic, duplicates included. Notifications must equal transfers, and skipped messages must equal duplicates: a thousand applied, a hundred skipped."
        focus: 1
      - emma: "The third runs two relays in parallel on the remaining rows. Eight hundred rows left, eight hundred sent: skip locked prevents double publishing."
        focus: 2
      - emma: "The fourth checks the ledger: the queries from exercise 7.6 return nothing, the ledger sums to zero, and the total balance is still a hundred million."
        say: "The fourth checks the ledger: the queries from exercise seven point six return nothing, the ledger sums to zero, and the total balance is still a hundred million."
        focus: 3

  - kind: table
    heading: "Step 6 · Three more tests, only in your Spring lab"
    columns: ["Test", "Assert"]
    widths: [4.6, 4.6]
    build: true
    points: [lab8-tests-2]
    rows:

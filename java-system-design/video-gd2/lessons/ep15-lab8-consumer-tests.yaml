      - ["consumerCrashBeforeOffsetCommit_\nnoDoubleEffect", "throw after the DB commit, before the offset commit → the message comes back and is skipped"]
      - ["eventsForOneAccountArriveInOrder", "with one relay, events for the same account_id reach the consumer in the order they were created"]
    lines:
      - emma: "Three more tests exist only in your Spring version. A poison message ends up in the DLT with its error headers, and the message after it is still processed. The partition isn't stuck."
        focus: 0
      - emma: "A consumer that crashes after the database commit but before the offset commit gets the message again, and skips it. No double effect."
        focus: 1
      - emma: "And with one relay, events for the same account reach the consumer in the order they were created."
        focus: 2


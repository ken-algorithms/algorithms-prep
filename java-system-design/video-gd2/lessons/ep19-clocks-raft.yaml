  - kind: code
    chapter: "Clocks lie"
    heading: "10.1 · Two clocks in every JVM"
    points: [clocks]
    code: |
      long start = System.currentTimeMillis();   // wall clock: NTP can move it, even BACKWARDS
      doWork();
      long wrong = System.currentTimeMillis() - start;   // can be negative, or far too big

      long t0 = System.nanoTime();               // monotonic: only goes forward
      doWork();
      long elapsedNs = System.nanoTime() - t0;   // the right way to measure a duration
    items:
      - {lines: [1, 3], t: "Wall clock: time of day, adjusted by NTP"}
      - {lines: [5, 7], t: "Monotonic: use it to measure durations"}
    lines:
      - emma: "Every JVM has two clocks. System current time millis is the wall clock. NTP adjusts it, and can even move it backwards, so a duration measured with it can come out negative."
        focus: 0
      - emma: "System nano time is monotonic: it only moves forward. Use it whenever you measure how long something took."
        focus: 1

  - kind: bullets
    heading: "10.1 · Skew is normal, so don't let a timestamp decide"
    style: dot
    points: [lww-skew]
    items:
      - {t: "Two machines a few ms to tens of ms apart is normal"}
      - {t: "So last-write-wins by timestamp can let the older write win", s: "and nothing reports an error"}
      - {t: "Trust order from a single log", s: "one Kafka partition, one DB sequence"}
      - {t: "Or from logical clocks", s: "Lamport clocks, version vectors"}
    lines:
      - emma: "Two machines whose clocks differ by a few milliseconds, even tens of milliseconds, is normal. So last-write-wins by timestamp can let the older write win, and nothing reports an error."
        focus: 1
      - emma: "Order you can trust comes from a single log, like one Kafka partition or one database sequence. Or from logical clocks: Lamport clocks and version vectors."
        focus: 3

  - kind: exercise
    chapter: "Exercise 10.1"
    n: "10.1"
    q: "Node X's clock runs 20 ms ahead of node Y's. Write 1 (limit = 5,000,000) reaches X at 10:00:00.000 real time; write 2 (limit = 3,000,000) reaches Y at 10:00:00.010. Conflicts are resolved by last-write-wins on the receiving node's timestamp. What's the final value, and is it right?"
    items:
      - {t: "Write 2 really happens 10 ms after write 1"}
    lines:
      - emma: "Exercise 10.1. Node X's clock is twenty milliseconds ahead of node Y's. Write one sets a limit of five million and reaches X at ten o'clock exactly. Write two sets three million and reaches Y ten milliseconds later. Last-write-wins on the receiving node's timestamp. What's the final value, and is it right?"
        say: "Exercise ten point one. Node X's clock is twenty milliseconds ahead of node Y's. Write one sets a limit of five million and reaches X at ten o'clock exactly. Write two sets three million and reaches Y ten milliseconds later. Last-write-wins on the receiving node's timestamp. What's the final value, and is it right?"
      - wait: 6

  - kind: stats
    heading: "Answer 10.1 — the older write wins, silently"
    points: [ex101]
    items:
      - {v: "10:00:00.020", l: "X stamps write 1", s: "its clock is 20 ms fast"}
      - {v: "10:00:00.010", l: "Y stamps write 2", s: "even though it happened later"}
      - {v: "5,000,000", l: "the final limit: write 1 wins", s: "wrong, and no error is reported", tone: bad}
    note: "For money limits: no LWW by clock. Use one source of order (one leader, one sequence) or a conditional update on a version."
    lines:
      - emma: "X stamps write one at ten o'clock and twenty milliseconds, because its clock is fast. Y stamps write two at ten milliseconds past."
        focus: 1
      - emma: "So last-write-wins keeps write one, five million, even though write two really happened later. The result is wrong, and no error is reported anywhere."
        focus: 2
      - emma: "For a money limit, never use last-write-wins by clock. Use a single source of order, one leader or one sequence, or a conditional update on a version number."

  - kind: bullets
    chapter: "Raft"
    heading: "10.2 · Raft in five lines"
    style: num
    points: [raft-five]
    items:
      - {t: "Roles and terms", s: "every node is a follower, a candidate or the leader; time is split into numbered terms"}
      - {t: "Election", s: "no word from a leader before the timeout → become a candidate and ask for votes"}
      - {t: "Majority wins", s: "a majority of the votes → leader of the new term"}
      - {t: "Replicate, then commit", s: "the leader takes writes and copies its log; an entry commits once a majority has it"}
      - {t: "Safe leaders", s: "a vote only goes to a log at least as up to date → every new leader has every committed entry"}
    lines:
      - emma: "Raft in five lines. Every node is a follower, a candidate, or the leader, and time is divided into numbered terms."
        focus: 0
      - emma: "A follower that hears nothing from a leader before its timeout becomes a candidate and asks for votes. With a majority, it becomes leader of the new term."
        focus: 2
      - emma: "The leader accepts writes and copies its log to the followers. An entry is committed once a majority has it."
        focus: 3
      - emma: "And a node only votes for a candidate whose log is at least as up to date as its own, so a new leader always has every committed entry."
        focus: 4

  - kind: stats
    heading: "10.2 · What a five-node cluster survives"
    points: [raft-tolerance]
    items:
      - {v: "2 of 5", l: "nodes can die", s: "the other 3 are still a majority", tone: ok}
      - {v: "3 | 2", l: "a network split", s: "the 3-node side keeps going; the 2-node side can't write", tone: warn}
      - {v: "etcd · Consul · KRaft", l: "where Raft runs", s: "Kafka needs no ZooKeeper since 4.0"}
    lines:
      - emma: "Five nodes survive two failures, because the remaining three are still a majority."
        focus: 0
      - emma: "If the network splits three and two, the three-node side keeps working, and the two-node side can't write."
        focus: 1
      - emma: "You'll meet Raft in etcd, in Consul, and in Kafka's KRaft mode. Since Kafka 4.0 there's no ZooKeeper at all."
        say: "You'll meet Raft in etcd, in Consul, and in Kafka's KRaft mode. Since Kafka four point oh there's no ZooKeeper at all."
        focus: 2

  - kind: exercise
    chapter: "Exercise 10.2"
    n: "10.2"
    q: "A 5-node Raft cluster."
    items:
      - {t: "(a) At most how many nodes can die while writes still work?"}
      - {t: "(b) The network splits 2 | 3 and the old leader is on the 2-node side. What happens to clients writing to it?"}
      - {t: "(c) Why do consensus clusters usually have an odd number of nodes?"}
    lines:
      - emma: "Exercise 10.2, a five-node cluster. A: how many nodes can die while writes still work? B: the network splits two and three, and the old leader is on the two-node side. What happens to its clients? C: why do consensus clusters have an odd number of nodes?"
        say: "Exercise ten point two, a five-node cluster. A: how many nodes can die while writes still work? B: the network splits two and three, and the old leader is on the two-node side. What happens to its clients? C: why do consensus clusters have an odd number of nodes?"
      - wait: 7

  - kind: table
    heading: "Answer 10.2"
    columns: ["", "Answer"]
    widths: [0.9, 8.4]
    build: true
    points: [ex102]
    rows:
      - ["(a)", "2: the remaining 3 are a majority of 5"]
      - ["(b)", "The old leader can't reach a majority, so it commits nothing and its clients time out. The 3-node side elects a leader with a higher term. When the network heals, the old leader sees the higher term, steps down, and drops its uncommitted entries"]
      - ["(c)", "4 nodes survive 1 failure, the same as 3, for one more machine and a bigger majority; 6 survive 2, the same as 5"]
    lines:
      - emma: "A: two. The remaining three are still a majority of five."
        focus: 0
      - emma: "B: the old leader can't reach a majority, so it commits nothing, and its clients time out. The three-node side elects a new leader with a higher term. When the network heals, the old leader sees that higher term, steps down to follower, and drops its uncommitted entries."
        focus: 1
      - emma: "C: four nodes survive one failure, exactly like three, but cost one more machine and need a bigger majority. Six survive two, exactly like five. Next episode: distributed locks and fencing tokens."
        focus: 2

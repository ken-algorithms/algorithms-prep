  - kind: code
    heading: "Answer 10.4 · One inventory row per night, one conditional update"
    points: [ex104-sql]
    code: |
      -- one row per (hotel, room type, night)
      create table room_type_inventory(hotel_id bigint, room_type_id bigint, date date,
          total int not null, reserved int not null, primary key (hotel_id, room_type_id, date));

      -- book 3 nights: ONE transaction that must update exactly 3 rows, or roll back
      update room_type_inventory set reserved = reserved + :rooms
       where hotel_id = :h and room_type_id = :t and date between :in and :out - 1
         and reserved + :rooms <= total * 1.1;
      -- rows updated < nights → at least one night is full → rollback
    items:
      - {lines: [2, 3], t: "Inventory per night: total and reserved"}
      - {lines: [6, 8], t: "All the nights in one update; the 10% overbooking is in the condition"}
      - {lines: [9, 9], t: "Fewer rows than nights → one night is full → roll back"}
    lines:
      - emma: "Keep one inventory row per hotel, room type and night, with the total and the number reserved."
        focus: 0
      - emma: "Booking three nights is one transaction with one conditional update over the date range. The condition allows reserved plus the new rooms up to total times one point one: that's the deliberate ten percent."
        focus: 1
      - emma: "If fewer rows were updated than there are nights, at least one night is full, so the whole booking rolls back."
        focus: 2

  - kind: table
    heading: "Answer 10.4 · Decisions and their trade-offs"
    columns: ["Problem", "Choose", "The trade-off"]
    widths: [1.8, 4.0, 3.6]
    build: true
    points: [ex104-decisions]
    rows:
      - ["Double booking", "a reservation_id generated by the client (an idempotency key), unique", "the client must keep the ID across retries"]
      - ["Overbooking", "a conditional update on the inventory rows", "peak dates fight over one row; still fine, each transaction holds it briefly"]
      - ["Payment", "hold the room as PENDING for 15 minutes → a payment saga → confirm or release", "rooms are “held” for up to 15 minutes"]
      - ["Search", "a cache or a replica, stale is OK; check again when booking", "the customer may see a room that is gone at booking time"]
    lines:
      - emma: "Double booking from retries: the client generates the reservation ID, used as an idempotency key with a unique constraint. The client must keep it across retries."
        focus: 0
      - emma: "Overbooking: the conditional update on the inventory rows. On peak dates many bookings fight over one row, but each transaction holds the lock very briefly, so it's fine."
        focus: 1
      - emma: "Payment: hold the room as pending for fifteen minutes, run a payment saga, then confirm or release. The cost: rooms can be held for up to fifteen minutes."
        focus: 2
      - emma: "And search reads a cache or a replica, where stale data is acceptable, and the booking checks again. A customer may see a room that's gone by the time they book."
        focus: 3


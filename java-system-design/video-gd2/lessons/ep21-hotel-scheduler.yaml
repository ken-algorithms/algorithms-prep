      - {t: "The fix is always one of: the right transaction boundary, a conditional update or lock, idempotency"}
    lines:
      - emma: "Recognise the family. This is family G: read, compute, then write on shared state, with someone else able to slip in between. It's the same family as problem 06, the race on a balance and its ledger."
        say: "Recognise the family. This is family G: read, compute, then write on shared state, with someone else able to slip in between. It's the same family as problem six, the race on a balance and its ledger."
        focus: 0
      - emma: "And the fix is always the right transaction boundary, a conditional update or a lock, and idempotency."
        focus: 1


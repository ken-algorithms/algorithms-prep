      - wait: 7

  - kind: diagram
    heading: "Answer 10.5 · The scheduler"
    points: [ex105]
    nodes:
      - {id: s, label: "Schedules", sub: "cron per tenant", x: 90, y: 70, w: 170, h: 80, shape: db}
      - {id: g, label: "One generator", sub: "unique (schedule_id, fire_time)", x: 390, y: 70, w: 280, h: 80}
      - {id: j, label: "job table", sub: "READY · run_at · tenant · priority", x: 760, y: 70, w: 270, h: 80, shape: db}
      - {id: w, label: "Workers", sub: "SKIP LOCKED + a lease · a fair share per tenant", x: 760, y: 265, w: 330, h: 86, at: 1}
      - {id: r, label: "Reaper", sub: "expired lease → READY again", x: 1070, y: 70, w: 200, h: 80, tone: warn, at: 2}
      - {id: res, label: "Results", sub: "written where lease_version = :v", x: 390, y: 265, w: 290, h: 80, tone: ok, at: 2}
    edges:
      - {a: s, b: g}
      - {a: g, b: j, label: "unique run"}
      - {a: j, b: w, at: 1}
      - {a: r, b: j, dashed: true, at: 2}
      - {a: w, b: res, at: 2}
    lines:
      - emma: "Only one place turns cron schedules into runs, and each run is unique by schedule ID and fire time. If two generators ever run at once, the duplicate insert simply fails. Generating twice is harmless."
        focus: 0
      - emma: "Workers claim ready jobs with skip locked and a lease, as in lab 10B. Fairness between tenants is family B, like problem 02: a fair share per tenant, so one tenant with ten thousand jobs can't block the others."
        say: "Workers claim ready jobs with skip locked and a lease, as in lab ten B. Fairness between tenants is family B, like problem two: a fair share per tenant, so one tenant with ten thousand jobs can't block the others."
        focus: 1
      - emma: "A stuck job is one whose lease expired. The reaper makes it ready again, and the late worker's result is fenced off by the lease version."
        focus: 2

  - kind: compare
    heading: "Answer 10.5 · “Exactly-once?” — the straight answer"
    points: [ex105-exactly]
    items:
      - {title: "No", tone: bad, lines: ["a worker can die after doing the work, before saying so", "so the job runs again"]}
      - {title: "What you do instead", tone: ok, lines: ["at-least-once execution", "+ idempotent jobs", "+ fencing when the result is written"]}
    lines:
      - emma: "And exactly-once? The straight answer is no. A worker can die after doing the work and before reporting it, so the job runs again."
        focus: 0
      - emma: "What you build instead is at-least-once execution, idempotent jobs, and fencing when the result is written. That's exactly what lab 10B gives you."
        say: "What you build instead is at-least-once execution, idempotent jobs, and fencing when the result is written. That's exactly what lab ten B gives you."
        focus: 1


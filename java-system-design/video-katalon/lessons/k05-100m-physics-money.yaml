id: k05-100m-physics-money
ep: 5
week: 10
tag: "K05 · AFTER PHASE 2"
title: "A hundred million a minute: physics and money"
subtitle: "CPU per request, bytes on the wire, dedup state, and one region as a blast radius — then cells"

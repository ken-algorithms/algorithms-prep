  - ../katalon-prep/katalon-prep-java/10-event-counting/README.md#36-retention
  - ../katalon-prep/katalon-prep-java/10-event-counting/README.md#37-bốn-job-nền
  - ../katalon-prep/katalon-system-design/04-event-counting-10k.md#63-thuật-toán-phân-rã-khoảng-thời-gian-bất-kỳ
  - ../katalon-prep/katalon-system-design/04-event-counting-10k.md#68-tỉ-lệ-50--đừng-bao-giờ-lưu-tỉ-lệ

  - kind: bullets
    chapter: "Honest limits"
    heading: "Say these limits before the interviewer does"
    style: check
    points: [t-honest]
    items:
      - {t: "Every number is arithmetic from assumptions: 20 pairs per request, 1 KB per request, 0.2 ms of collector CPU"}
      - {t: "Thresholds such as 30–50k rows/s or 100k Redis operations/s are orders of magnitude, not benchmarks"}
      - {t: "P01 and P04 costs are real measurements; multiplying them by requests per second is an estimate"}
      - {t: "Prices are list prices at the time of writing"}
      - {t: "No demo runs at 10M or 100M: say “I would build and measure it like this”, never “I ran it”"}
    lines:
      - emma: "Last, the honest limits. Every number here is arithmetic from assumptions, and the thresholds are orders of magnitude, not benchmarks."
        focus: 1
      - emma: "The Track P costs are real measurements, and multiplying them is an estimate. Prices change. And nothing here has been run at ten million a minute, so say: I would build it and measure it like this. Never: I ran it."
        focus: 4

  - kind: bullets
    chapter: "Recap"
    heading: "Recap"
    style: dot
    items:
      - {t: "10M: one record per request · key = batch_id · dedup · two-level windows · GREATEST · packed raw + reconcile"}
      - {t: "100M: cells summed globally · (client_id, seq) · binary wire · raw stays in region · sketches only for distinct and top-K"}
      - {t: "Nothing new: phase 1 gave the numbers and the × 10 frame; phase 2 gave Kafka, windows and fencing"}
      - {t: "Back to the roadmap: continue phase 2 or 3 where you left off"}
    lines:
      - tom: "That's the answer I was hoping for at the Principal round."
      - emma: "And none of it was new. Phase one gave the numbers and the ten-times frame. Phase two gave Kafka, windows and fencing. Back to the roadmap, where you left off."
        focus: 2

  - kind: acronyms
    chapter: "Acronyms in this video"
    heading: "Acronyms in this video"
    items:
      - {abbr: CPU, full: "central processing unit", vi: "bộ xử lý"}
      - {abbr: SDK, full: "software development kit", vi: "thư viện phía client"}
      - {abbr: ID, full: "identifier", vi: "mã định danh"}
      - {abbr: OLAP, full: "online analytical processing", vi: "kho cột cho truy vấn gom nhiều dòng"}
      - {abbr: CRDT, full: "conflict-free replicated data type", vi: "kiểu dữ liệu gộp được không xung đột"}
      - {abbr: 2PC, full: "two-phase commit", vi: "giao dịch phân tán hai pha"}
      - {abbr: HTTPS, full: "HTTP over TLS", vi: "HTTP có mã hoá"}
      - {abbr: LSM, full: "log-structured merge tree", vi: "cấu trúc lưu trữ ghi tuần tự (RocksDB)"}
    lines:
      - emma: "CPU is a processor core, SDK the client library, ID an identifier, and OLAP a columnar store for aggregates."
        focus: 3
      - emma: "A CRDT is a data type that copies can update separately and merge, and two P C is two-phase commit. HTTPS is encrypted HTTP. And an LSM tree, a log-structured merge tree, is the write-friendly storage under RocksDB."
        focus: 7

  - kind: exercise
    chapter: "Ten million"
    label: "Question"
    n: "1"
    q: "“Ten million requests a minute, same contract. Two minutes, go.”"
    items:
      - {t: "Restate · new numbers · what doesn't change · what breaks first · the fix with trade-offs · not yet"}
    lines:
      - tom: "Ten million requests a minute, same contract. Two minutes. Go."
      - wait: 10
        note: "Say it out loud, with numbers. Then compare."

  - kind: speech
    heading: "Model answer · 10 million a minute"
    points: [t-answer-10m]
    items:
      - {t: "“So, 10 million a minute, still 20 pairs, still exact over any range: 166,000 requests and 3.3 million events per second, 288 billion a day.”"}
      - {t: "“The read path stays: rollups grow with groups times buckets, so a one-year query still reads about 500 rows.”"}
      - {t: "“What breaks first: keyed by tenant, the biggest tenant makes one partition hot; and no database keeps a row per event.”"}
      - {t: "“The collector turns each request into one record; Kafka is keyed by batch_id; the stream job drops duplicates for 15 minutes and counts in one-minute windows by event time, in two levels.”"}
      - {t: "“The sink overwrites with GREATEST, so replays and zombies can't move a count back; packed raw goes to object storage, and an hourly batch reconciles.”"}
      - {t: "“I'm not adding regions, client-side batching or sketches yet: none is needed at this rung.”"}
    lines:
      - read: emma
        focus: 0
      - read: emma
        focus: 1
      - read: emma
        focus: 2
      - read: emma
        focus: 3
      - read: emma
        focus: 4
      - read: emma
        focus: 5

  - kind: exercise
    chapter: "A hundred million"
    label: "Question"
    n: "2"
    q: "“And a hundred million a minute?”"
    items:
      - {t: "New numbers · why it's physics and money · the five changes · what you still don't build"}
    lines:
      - tom: "And a hundred million a minute?"
      - wait: 10
        note: "Price one microsecond first."

  - kind: speech
    heading: "Model answer · 100 million a minute"
    points: [t-answer-100m]
    items:
      - {t: "“1.67 million requests and 33 million events per second, 13 Gbit/s coming in, three times that at the peak.”"}
      - {t: "“Now it's physics and money: a microsecond of CPU per request is 1.7 cores; raw copied across zones is a daily bill; dedup by batch_id is 1.5 billion keys.”"}
      - {t: "“So: regional cells that each run the 10-million pipeline, only counts summed globally; dedup by client and sequence number; a binary, compressed wire; packed raw that stays in its region.”"}
      - {t: "“Sketches only for distinct counts and top-K; totals stay exact because they're cheap.”"}
      - {t: "“Not exactly-once across regions, not one global Kafka; every answer says whether it is final.”"}
    lines:
      - read: emma
        focus: 0
      - read: emma
        focus: 1
      - read: emma
        focus: 2
      - read: emma
        focus: 3
      - read: emma
        focus: 4

  - kind: table
    chapter: "Rapid fire"
    heading: "Rapid fire: one sentence each"
    columns: ["Tom asks", "Emma answers"]
    widths: [3.4, 5.8]
    build: true
    points: [t-rapid]
    rows:
      - ["“Your biggest tenant is 30% of the load?”", "Keyed by batch_id it spreads over every partition, and the global step only sees partial sums"]
      - ["“A retry after the dedup key expired?”", "The SDK gives up after 10 minutes, the key lives 15; anything later, the hourly reconcile catches"]
      - ["“A breakdown per 100,000 keys?”", "At 10M a minute it compresses 500 times, so worth it, in an OLAP store; top-K with Count-Min Sketch"]
      - ["“A region goes down?”", "Clients move to another cell with a new epoch; the dead cell's numbers stay not final until its raw is reconciled"]
      - ["“What costs the most at 100M?”", "Not the database: collector CPU per request, bytes across zones, and raw storage"]
    lines:
      - tom: "Rapid fire. Your biggest tenant is thirty percent of the load?"
      - emma: "Keyed by batch ID, it spreads over every partition, and the global step only sees partial sums."
        focus: 0
      - tom: "A retry after the dedup key expired?"
      - emma: "The SDK gives up after ten minutes and the key lives fifteen. Anything later, the hourly reconcile catches."
        focus: 1
      - tom: "A breakdown per key, a hundred thousand keys?"
      - emma: "At ten million a minute, a per-key rollup compresses five hundred times, so it's worth it, in an OLAP store. For the hottest keys, a Count-Min Sketch."
        focus: 2
      - tom: "A region goes down?"
      - emma: "Its clients move to another cell with a new epoch. The dead cell's numbers stay marked not final until its raw data is reconciled."
        focus: 3
      - tom: "And what costs the most at a hundred million?"
      - emma: "Not the database. Collector CPU per request, bytes copied across zones, and raw storage."
        focus: 4


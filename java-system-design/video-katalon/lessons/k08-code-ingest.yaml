  - kind: code
    chapter: "The request"
    heading: "EventBatch and EventClassifier"
    points: [c1-classifier]
    code: |
      public record EventBatch(String tenantId, String batchId, Instant ts, List<Item> items) {
          public record Item(String key, Object value) {}   // Boolean, String, Number or null
      }

      public Outcome classify(String key, Object value) {
          if (key == null || !registry.contains(key)) {
              return Outcome.FAKE_KEY;                      // key first
          }
          if (value instanceof Boolean b) {
              return b ? Outcome.TRUE : Outcome.FALSE;
          }
          if (value instanceof String s) {
              if (s.equalsIgnoreCase("true"))  return Outcome.TRUE;
              if (s.equalsIgnoreCase("false")) return Outcome.FALSE;
          }
          return Outcome.MALFORMED;                         // null, 1, "yes"
      }
    items:
      - {lines: [1, 3], t: "a record; value stays Object, exactly as the JSON sent it"}
      - {lines: [5, 8], t: "the key is checked first"}
      - {lines: [9, 15], t: "pattern matching on the value's type"}
      - {lines: [16, 16], t: "everything else is malformed, never false"}
    lines:
      - emma: "The request is a Java record. The value stays an Object, exactly as JSON sent it: a boolean, a string, a number, or null."
        focus: 0
      - emma: "The classifier checks the key first. Not in the registry means fake key, full stop."
        focus: 1
      - emma: "Then pattern matching on the value's type: a boolean, or the strings true and false."
        focus: 2
      - emma: "Everything else is malformed. That last line is the one that keeps a broken client visible."
        focus: 3

  - kind: code
    chapter: "Ingest"
    heading: "IngestService.ingest(): the checks"
    points: [c1-ingest-checks]
    code: |
      public IngestResult ingest(EventBatch b) {
          validate(b);                                      // ids, ts, 1..1000 items, else 400
          int n = b.items().size();
          Instant now = clock.instant();
          if (b.ts().isBefore(now.minus(RAW_RETENTION))) {  // 7 days
              rejectedTooLate.addAndGet(n);                 // a metric, never silent
              throw new TooLateException("older than raw retention");   // → 422
          }
          if (b.ts().isAfter(now.plus(MAX_CLOCK_SKEW))) {   // 5 minutes
              throw new IllegalArgumentException("event time is in the future");
          }
          if (b.ts().isBefore(now.minus(RollupJob.RECOMPUTE_WINDOW))) {
              lateBeyondWindow.addAndGet(n);                // stored; reconcile repairs it
          }
          partitions.ensureFor(b.ts());
    items:
      - {lines: [2, 2], t: "reject garbage before it reaches the database"}
      - {lines: [5, 8], t: "too old: refuse with 422 and count it"}
      - {lines: [9, 11], t: "a client clock in the future: 400"}
      - {lines: [12, 15], t: "late but storable: count it, store it, make sure its day exists"}
    lines:
      - emma: "The ingest method starts with the checks. Validate the shape first, so garbage never reaches the database."
        focus: 0
      - emma: "Too old for raw retention: add to the rejected too late counter, and throw. The controller turns that into a four twenty-two."
        focus: 1
      - emma: "A timestamp more than five minutes in the future is a broken client clock: four hundred."
        focus: 2
      - emma: "Late, but within retention: count it as late beyond the window, and store it anyway. The reconciler will repair its bucket. Finally, make sure the partition for its day exists."
        focus: 3

  - kind: code
    chapter: "One insert"
    heading: "IngestService.ingest(): one insert per batch"
    points: [c1-insert]
    code: |2
          var sql = new StringBuilder(
              "INSERT INTO raw_events (event_id, ts, tenant_id, key_name, outcome) VALUES ");
          List<Object> args = new ArrayList<>(n * 5);
          for (int i = 0; i < n; i++) {
              EventBatch.Item it = b.items().get(i);
              sql.append(i == 0 ? "(?,?,?,?,?)" : ",(?,?,?,?,?)");
              args.add(eventId(b.tenantId(), b.batchId(), i));
              args.add(utc(b.ts()));
              args.add(b.tenantId());
              args.add(keyName(it.key()));
              args.add(classifier.classify(it.key(), it.value()).code);
          }
          sql.append(" ON CONFLICT (event_id, ts) DO NOTHING");
          int inserted = jdbc.update(sql.toString(), args.toArray());
          return new IngestResult(n, inserted, n - inserted);
      }
    items:
      - {lines: [1, 6], t: "one statement, twenty value tuples: one round trip"}
      - {lines: [7, 11], t: "computed id · event time as OffsetDateTime in UTC · outcome code"}
      - {lines: [13, 15], t: "the row count it returns is the number of new rows"}
    lines:
      - emma: "Then one statement for the whole batch: twenty value tuples, one round trip."
        focus: 0
      - emma: "Each row gets the computed event ID, the event time as an offset date time in UTC, never a java sql timestamp that drags in the machine's time zone, and the outcome code."
        focus: 1
      - emma: "On conflict, do nothing. The update count that comes back is exactly the number of new rows, so the response can say how many were duplicates."
        focus: 2

  - kind: code
    chapter: "The id"
    heading: "eventId() and the controller"
    points: [c1-event-id-code]
    code: |
      public static UUID eventId(String tenantId, String batchId, int index) {
          return UUID.nameUUIDFromBytes((tenantId + '/' + batchId + '/' + index).getBytes(UTF_8));
      }

      @PostMapping("/events")
      public ResponseEntity<IngestResult> ingest(@RequestBody EventBatch batch) {
          return ResponseEntity.status(HttpStatus.ACCEPTED).body(ingest.ingest(batch));
      }

      @GetMapping("/stats")
      public Stats stats(@RequestParam String tenant, @RequestParam Instant from,
                         @RequestParam Instant to) {
          return stats.query(tenant, from, to);
      }
    items:
      - {lines: [1, 3], t: "a name-based UUID: same tenant, batch and index → same id"}
      - {lines: [5, 8], t: "202 Accepted with {received, inserted, duplicates}"}
      - {lines: [10, 14], t: "any range, e.g. from=2026-08-26T03:17:30Z, parsed into Instant"}
    lines:
      - emma: "The event ID is one line: a name-based UUID of tenant, batch and index. The whole idempotency story rests on it."
        focus: 0
      - emma: "The controller is thin. Post events returns two oh two, accepted, with the ingest result as the body."
        focus: 1
      - emma: "And get stats takes the tenant and any range, parsed straight into Java instants."
        focus: 2


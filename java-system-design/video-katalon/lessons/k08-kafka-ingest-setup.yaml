  - kind: exercise
    chapter: "The challenge"
    label: "Ingestion Challenge"
    q: "How do you ingest 50,000 requests per second into Kafka without thread exhaustion or network saturation?"
    items:
      - {t: "Each request has 20 boolean event items (~1 KB JSON)"}
      - {t: "50,000 req/s means 50 MB/s network ingress"}
      - {t: "Single-record synchronous produce kills throughput"}
    lines:
      - tom: "Our target load is fifty thousand requests a second, each carrying twenty event items. How does synchronous sending break, and how do we size the producer?"
      - emma: "Think about the physics. Fifty thousand requests a second with one kilobyte each equals fifty megabytes per second of raw payload. If each HTTP thread waits for a Kafka acknowledge, your web server runs out of threads in milliseconds."
      - wait: 7
        note: "50,000 requests/s × 1 KB = 50 MB/s. Never call future.get() on every send!"

  - kind: bullets
    chapter: "KRaft architecture"
    heading: "KRaft: Kafka without ZooKeeper"
    items:
      - {t: "ZooKeeper metadata bottleneck removed", s: "In Kafka 3.3+, KRaft consensus runs directly inside broker processes"}
      - {t: "Single metadata partition", s: "Cluster state stored in an internal log topic called @metadata"}
      - {t: "Instant failover recovery", s: "Leader election in milliseconds rather than seconds"}
      - {t: "Minimal local footprint", s: "One single process runs both controller and broker roles for development"}
    lines:
      - emma: "KRaft manages cluster metadata using the Raft consensus algorithm directly inside Kafka brokers. This eliminates external ZooKeeper processes, removes metadata synchronization bottlenecks, and enables near-instant leader election."
        focus: 0
      - tom: "How does this change our production and local development setups?"
      - emma: "Historically, ZooKeeper had to maintain watch trees for every topic and partition. When thousands of partitions moved, ZooKeeper became the primary cluster bottleneck. With KRaft, metadata changes append to an internal replicated log, drastically reducing complexity and resource usage."
        focus: 1
      - tom: "That means local development and automated testing require only one single process or Docker container."
        focus: 3

  - kind: table
    chapter: "Batching math"
    heading: "The physics of producer batching"
    columns: ["Metric", "Without batching", "With tuned batching"]
    rows:
      - ["Records per second", "50,000", "50,000"]
      - ["Kafka batches per second", "50,000", "800"]
      - ["Network packets per second", "50,000", "850"]
      - ["Kernel syscall overhead", "Very high (CPU bound)", "Negligible (under 5% CPU)"]
      - ["Effective throughput", "12,000 req/s (stalled)", "65,000+ req/s (line rate)"]
    note: "Batching reduces packet headers and kernel interrupts by over sixty times"
    lines:
      - emma: "Look at the batching mathematics. Sending fifty thousand records individually produces fifty thousand TCP packets and fifty thousand kernel system calls, hitting a wall at twelve thousand requests a second."
        focus: 1
      - tom: "Why does sending single records create such high CPU pressure?"
      - emma: "Every single socket send requires a context switch into kernel space, allocating socket buffers and appending packet headers. Network interface cards cannot process fifty thousand individual small packets efficiently."
        focus: 3
      - emma: "With a tuned batch size of sixty-four kilobytes and linger of ten milliseconds, Kafka bundles sixty records per batch, reducing network interrupts by sixty times."
        focus: 4

  - kind: code
    chapter: "Producer properties"
    heading: "KRaft and Spring Boot Ingestion configuration"
    code: |
      spring:
        kafka:
          producer:
            acks: all
            retries: 10
            batch-size: 65536
            properties:
              linger.ms: 10
              compression.type: snappy
              max.in.flight.requests.per.connection: 5
    items:
      - {lines: [1, 3], t: "KRaft and Spring Boot Ingestion setup without ZooKeeper"}
      - {lines: [4, 5], t: "Durability: acks=all waits for full in-sync replica commit"}
      - {lines: [6, 8], t: "Throughput: batch.size 65536 bytes with 10 ms linger.ms"}
      - {lines: [9, 10], t: "snappy compression with max 5 in-flight pipelined requests"}
    points: [k-ingest-setup]
    lines:
      - emma: "Here is the production configuration for KRaft and Spring Boot Ingestion without ZooKeeper. Setting acks to all ensures zero message loss across brokers. We set batch.size to 65536 and linger.ms to 10."
        focus: 0
      - tom: "What does linger.ms do when the traffic rate is very high?"
      - emma: "Linger specifies the maximum duration the producer will wait for more records before sending the buffer. If the sixty-four kilobyte buffer fills sooner, it dispatches immediately without waiting for the timer."
        focus: 2
      - emma: "We configure snappy compression to compress batches with minimal CPU overhead, and keep max.in.flight.requests.per.connection at 5 to preserve ordering while maximizing pipe utilization."
        focus: 3

  - kind: code
    chapter: "Ingestion API code"
    heading: "EventIngestionController.java"
    code: |
      @RestController
      @RequestMapping("/events")
      public class EventIngestionController {
        private final EventProducer producer;
        @PostMapping
        public ResponseEntity<Map<String, Object>> ingest(
            @RequestBody EventBatch request) {
          String batchId = UUID.randomUUID().toString();
          producer.sendBatch(batchId, request);
          return ResponseEntity.accepted()
              .body(Map.of("batch_id", batchId, "status", "QUEUED"));
        }
      }
    items:
      - {lines: [1, 3], t: "Spring Boot REST controller exposing POST /events"}
      - {lines: [6, 8], t: "Assigns batchId UUID and dispatches asynchronously"}
      - {lines: [9, 10], t: "Returns HTTP 202 Accepted immediately without blocking"}
    lines:
      - tom: "The ingestion endpoint assigns a unique UUID batch identifier to each incoming request, passes it to the producer, and returns HTTP 202 Accepted immediately."
        focus: 1
      - emma: "HTTP 202 Accepted tells the client that the payload is safely accepted for asynchronous processing. The web worker thread is freed in less than one millisecond."
        focus: 2
      - tom: "Should the HTTP response wait for the Kafka broker to acknowledge the write?"
      - emma: "Never in high throughput streaming! Waiting for broker disk flush and replication latency binds server threads for twenty to fifty milliseconds, causing thread starvation."
        focus: 2

  - kind: compare
    chapter: "Compression choices"
    heading: "Compression codec comparison"
    items:
      - title: "None (Raw JSON)"
        lines:
          - "50 MB/s network bandwidth"
          - "0% CPU overhead"
          - "High network buffer pressure"
        tone: neutral
      - title: "Gzip"
        lines:
          - "15 MB/s network bandwidth"
          - "Heavy CPU cost (30% core burn)"
          - "Unsuitable for high RPS ingestion"
        tone: bad
      - title: "Snappy (Recommended)"
        lines:
          - "22 MB/s network bandwidth"
          - "Light CPU cost (under 4% core burn)"
          - "Optimal for streaming real-time pipelines"
        tone: good
    lines:
      - tom: "Why choose Snappy compression over Gzip or uncompressed JSON?"
      - emma: "Gzip achieves the highest compression ratio, but burns thirty percent of CPU cores compressing JSON strings. Snappy strikes the ideal balance: sixty percent bandwidth reduction with negligible CPU consumption."
      - tom: "Does Snappy compress each message individually, or the entire batch?"
      - emma: "Snappy compresses the batch payload as a single contiguous buffer. Because repeated JSON keys like tenant and timestamp recur dozens of times in a batch, compression efficiency multiplies."

  - kind: pattern
    chapter: "Callback vs blocking"
    heading: "CompletableFuture: asynchronous send pattern"
    bad: |
      CompletableFuture<SendResult<String, EventBatch>> f =
          kafkaTemplate.send("events.ingest", key, data);
      f.get(5, TimeUnit.SECONDS); // KILLS THROUGHPUT!
    good: |
      kafkaTemplate.send("events.ingest", key, data)
          .whenComplete((res, ex) -> {
            if (ex != null) log.error("Send failed: {}", ex);
          });
    lines:
      - tom: "The most common junior mistake is calling get() on the future returned by KafkaTemplate."
        focus: 0
      - emma: "Calling get() blocks the caller thread waiting for broker roundtrip acknowledgment, dropping throughput from sixty thousand down to two hundred requests per second. Always register non-blocking callbacks."
        focus: 1
      - tom: "What should you do inside whenComplete if a send error occurs?"
      - emma: "Log the error with contextual tenant and batch metadata, increment an alert counter metric, and if necessary, route the failed batch to an emergency disk buffer."
        focus: 1


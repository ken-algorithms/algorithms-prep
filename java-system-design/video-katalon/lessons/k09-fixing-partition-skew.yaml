  - kind: exercise
    chapter: "The failure mode"
    label: "Partition Skew Problem"
    q: "Why does partition key = tenant_id break under scale, and why is batch_id safe for event counting?"
    items:
      - {t: "Tenant A has 40% of all traffic"}
      - {t: "Do we need total ordering across all batches of the same tenant?"}
      - {t: "What happens to consumer thread lag on the overloaded partition?"}
    lines:
      - tom: "Why does tenant partitioning break down when one tenant generates forty percent of the load?"
      - emma: "When one enterprise customer produces forty percent of the events, Kafka assigns all their records to a single partition. That partition becomes the bottleneck of the entire platform."
      - wait: 7
        note: "Does event counting require order per tenant? No, aggregation only counts totals."


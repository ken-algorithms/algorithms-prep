  - ../katalon-prep/katalon-prep-java/10-event-counting/README.md#5-test-chứng-minh-gì--kết-quả-chạy-thật
  - ../katalon-prep/katalon-prep-java/10-event-counting/README.md#6-chạy-như-một-service

id: k10-fixing-rebalance-storm
ep: 10
week: 11
tag: "K10 · REBALANCE STORM"
title: "Fixing consumer lag and the P20 rebalance storm"
subtitle: "Why per-message processing triggers CommitFailedException, and how batch listeners fix it"
covers:
  - ../katalon-prep/katalon-prep-java/09-kafka-pipeline/README.md#2-5-sự-cố-production-kinh-điển-và-cách-code-để-fix
  - ../katalon-prep/katalon-system-design/07-event-counting-10m-100m.md#51-sơ-đồ
scenes:
  - kind: title
    chapter: "Intro"
    items:
      - {t: "Source: module 09 · BatchProcessingVsSlowConsumerTest"}
      - {t: "Reproducing and fixing P20 rebalance storm"}
    lines:
      - tom: "Episode K10. The consumer lag spike: why does a twenty millisecond database query cause consumer groups to endlessly rebalance, and how do you fix it?"
      - emma: "This is the classic P20 slow consumer failure mode. We reproduce the timeout storm and fix it with Spring Kafka batch listeners."

  - kind: acronyms
    chapter: "Acronyms in this video"
    heading: "Acronyms in this video"
    items:
      - {abbr: CPU, full: "Central Processing Unit", vi: "bộ vi xử lý trung tâm"}
      - {abbr: DB, full: "database", vi: "cơ sở dữ liệu"}
      - {abbr: JDBC, full: "Java Database Connectivity", vi: "chuẩn kết nối cơ sở dữ liệu của Java"}
      - {abbr: JVM, full: "Java Virtual Machine", vi: "máy ảo Java thực thi bytecode"}
      - {abbr: SQL, full: "Structured Query Language", vi: "ngôn ngữ truy vấn cấu trúc"}
    lines:
      - emma: "SQL is Structured Query Language, and a DB is a database store."
        focus: 1
      - emma: "JDBC is the Java Database Connectivity driver. CPU is the processor core, and JVM is the Java Virtual Machine executing consumer workers."
        focus: 4

  - kind: exercise
    chapter: "The failure mode"
    label: "P20 Slow Consumer Dilemma"
    q: "A consumer polls 500 records. Each record takes 20 ms in the database. What happens when max.poll.interval.ms is 6,000 ms?"
    items:
      - {t: "500 records × 20 ms = 10,000 ms of processing"}
      - {t: "Coordinator timeout is 6,000 ms"}
      - {t: "The consumer heartbeat thread is still running normally!"}
    lines:
      - tom: "A consumer fetches five hundred records in one poll. Writing each record to the database takes twenty milliseconds. What happens?"
      - emma: "Five hundred records multiplied by twenty milliseconds equals ten thousand milliseconds, or ten full seconds. But the coordinator expects a poll every six seconds."
      - wait: 7
        note: "500 × 20 ms = 10 s > 6 s max.poll.interval.ms. Coordinator kicks the consumer!"

  - kind: stats
    chapter: "The timeout math"
    heading: "The mathematics of a rebalance storm"
    sub: "Simulated in BatchProcessingVsSlowConsumerTest"
    items:
      - {v: "500", l: "Records per poll", s: "Default max.poll.records"}
      - {v: "20 ms", l: "Per-record DB latency", s: "Single SQL insert roundtrip"}
      - {v: "10,000 ms", l: "Total poll duration", s: "Exceeds poll deadline by 4 seconds", tone: bad}
      - {v: "6,000 ms", l: "max.poll.interval.ms", s: "Configured coordinator deadline", tone: warn}
    lines:
      - emma: "Look at the numbers. The heartbeat thread continues sending background pings, but the coordinator notices that the poll loop has not fetched records for ten seconds."
        focus: 2
      - tom: "Why does Kafka care about poll frequency if the heartbeat thread is still alive?"
      - emma: "Because a live heartbeat only proves the JVM process is alive. It does not prove the worker is actually making forward progress on data processing."
        focus: 3
      - tom: "So if your database slows down under load, a heartbeat thread cannot prevent the consumer group from tearing itself apart."
      - emma: "Exactly. The coordinator assumes the poll loop thread is frozen, deadlocked, or in an infinite loop, and it immediately initiates group rebalancing."
        focus: 3

  - kind: bullets
    chapter: "The infinite loop"
    heading: "The infinite rebalance avalanche"
    items:
      - {t: "Consumer kicked by coordinator", s: "Coordinator marks the consumer dead and triggers cluster rebalance"}
      - {t: "CommitFailedException", s: "When the slow worker finally finishes 10s of work, its offset commit is rejected"}
      - {t: "Partition reassignment", s: "Partitions are handed over to another healthy consumer in the group"}
      - {t: "Repeated crash cycle", s: "The new consumer re-reads the exact same uncommitted 500 records and blocks for 10s too!"}
    lines:
      - emma: "When the deadline expires, the coordinator evicts the consumer and revokes its partitions. When the worker finally finishes ten seconds later, calling commit throws CommitFailedException."
        focus: 1
      - tom: "And what happens to the next consumer that inherits those partitions?"
      - emma: "It fetches the exact same uncommitted five hundred records, blocks for ten seconds, gets evicted too, and the entire consumer group enters an infinite rebalance death spiral."
        focus: 3
      - tom: "Zero records are committed, lag skyrockets to millions, and all consumers waste one hundred percent of their time rebalancing."

  - kind: code
    chapter: "The bad code"
    heading: "Single-record listener: P20 anti-pattern"
    code: |
      @KafkaListener(topics = "events.ingest")
      public void onMessage(ConsumerRecord<String, EventBatch> record) {
        // ANTI-PATTERN: 500 individual DB network calls!
        // 500 records * 20ms = 10,000ms > max.poll.interval.ms!
        saveToDatabase(record.value());
      }
    items:
      - {lines: [1, 2], t: "Listener configured to process one record per invocation"}
      - {lines: [3, 5], t: "20 ms JDBC database call executed sequentially for each record"}
    lines:
      - tom: "Here is the anti-pattern: processing records one by one in a loop with individual database transactions."
        focus: 0
      - emma: "Even if your database connection pool is healthy, executing five hundred separate network roundtrips sequentially guarantees that any latency spike triggers a cluster rebalance."
        focus: 1

  - kind: code
    chapter: "Batch listener fix"
    heading: "BatchEventConsumer.java: batch processing"
    code: |
      @KafkaListener(topics = "events.ingest",
                     containerFactory = "batchFactory")
      public void onBatch(List<ConsumerRecord<String, EventBatch>> records,
                          Acknowledgment ack) {
        // BATCH FIX: 1 bulk SQL insert for all 500 records in 1ms!
        rollupRepository.saveAllBatches(records);
        ack.acknowledge();
      }
    items:
      - {lines: [1, 3], t: "Spring Kafka listener receiving List of records"}
      - {lines: [5, 6], t: "BatchEventConsumer performs 1 bulk batch update in DB"}
      - {lines: [7, 7], t: "Manual offset acknowledgment after successful DB batch"}
    points: [k-rebalance-fix]
    lines:
      - emma: "In production, P20 slow consumers taking 10s exceed max.poll.interval.ms, throwing CommitFailedException. With BatchEventConsumer, we receive a List of records and execute a single bulk batch update in DB."
        focus: 1
      - tom: "Instead of five hundred separate roundtrips, the consumer issues one multi-row JDBC statement."
        focus: 0
      - emma: "After the database transaction commits, we call acknowledge to advance the Kafka offset cleanly."
        focus: 2

  - kind: table
    chapter: "Performance comparison"
    heading: "Single record vs batch listener"
    columns: ["Architecture", "DB roundtrips", "Duration (500 records)", "Throughput", "Stability"]
    rows:
      - ["Single-record listener", "500 queries", "10,000 ms", "50 records/s", "Fails (Rebalance loop)"]
      - ["BatchEventConsumer", "1 bulk query", "1 ms", "500,000 records/s", "100% stable (0 rebalances)"]
    note: "Batch database upsert is ten thousand times faster than per-record calls"
    lines:
      - emma: "Look at the benchmark from BatchProcessingVsSlowConsumerTest. Processing five hundred records individually took ten seconds and caused an outage."
        focus: 0
      - emma: "Batch processing completed all five hundred records in one millisecond, achieving five hundred thousand records a second with zero rebalances."
        focus: 1
      - tom: "That is a ten-thousand-fold performance increase with zero extra hardware."
      - emma: "And because all five hundred records execute within a single JDBC transaction boundary, we eliminate five hundred connection acquisitions and five hundred transaction commits."
        focus: 1

  - kind: compare
    chapter: "Assignor strategies"
    heading: "Partition assignor protocols"
    items:
      - title: "Eager Assignor (Range / RoundRobin)"
        lines:
          - "Revokes all partitions during rebalance"
          - "Stop-the-world pause across all consumers"
          - "Catastrophic under consumer lag spikes"
        tone: bad
      - title: "CooperativeStickyAssignor (Recommended)"
        lines:
          - "Only revokes partitions that need migration"
          - "Unaffected workers continue consuming without interruption"
          - "Reduces rebalance duration from 10s to 50ms"
        tone: good
    lines:
      - tom: "How does the partition assignor impact rebalance severity?"
      - emma: "Legacy eager assignors revoke every partition in the cluster during a rebalance, causing a full stop-the-world pause."
      - emma: "CooperativeStickyAssignor only migrates reassigned partitions. All other consumer pods keep processing without stopping."

  - kind: pattern
    chapter: "Sizing guidelines"
    heading: "Consumer configuration formula"
    bad: |
      # DANGEROUS: High records with short interval
      max.poll.records: 5000
      max.poll.interval.ms: 10000 # 5000 * 20ms = 100s > 10s!
    good: |
      # SAFE: Sized with 3x safety margin
      max.poll.records: 500
      max.poll.interval.ms: 300000 # 500 * 20ms = 10s << 300s
    lines:
      - tom: "What is the golden rule for setting max.poll.records and max.poll.interval.ms?"
        focus: 0
      - emma: "Always calculate the worst-case p99 processing time for max.poll.records. The product should be less than one third of max.poll.interval.ms."
        focus: 1
      - emma: "Give your workers at least three times more time than normal to absorb transient database stalls."

  - kind: bullets
    chapter: "Automated verification"
    heading: "Verifying the fix in module 09"
    items:
      - {t: "Run test suite", s: "mvn test -Dtest=BatchProcessingVsSlowConsumerTest"}
      - {t: "Simulates 10s timeout", s: "Confirms that single record processing exceeds the 6s timeout"}
      - {t: "Verifies batch speedup", s: "Confirms batch processing finishes 500 records in 1ms"}
    lines:
      - tom: "How can anyone run this test to verify the fix?"
      - emma: "Execute BatchProcessingVsSlowConsumerTest in module zero nine. The test directly asserts both the failure condition and the one-millisecond batch resolution."

  - kind: bullets
    chapter: "Recap"
    heading: "Rebalance storm recap"
    items:
      - {t: "Poll deadline enforcement", s: "max.poll.interval.ms measures data progress, not heartbeats"}
      - {t: "Batch listeners", s: "Always use BatchMessageListener for database-backed streaming"}
      - {t: "Cooperative assignor", s: "Configure CooperativeStickyAssignor to prevent stop-the-world pauses"}
      - {t: "Formula sizing", s: "max.poll.records times p99 latency must stay under one third of the deadline"}
    lines:
      - tom: "To recap episode K10: never execute single-record database calls inside Kafka listeners. Batch processing turns a ten-second rebalance loop into a one-millisecond write."
      - emma: "In episode K11, we tackle the next production nightmare: corrupted poison pill messages that crash consumers indefinitely."

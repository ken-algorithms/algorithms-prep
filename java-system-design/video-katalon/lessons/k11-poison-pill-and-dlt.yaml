    chapter: "Verified test metrics"
    heading: "Metrics from PoisonPillDltTest"
    sub: "10 valid batches plus 1 poisoned payload"
    items:
      - {v: "11 / 11", l: "Main topic offset", s: "100% committed with zero lag", tone: good}
      - {v: "10", l: "Valid batches saved", s: "Processed into database without delay", tone: good}
      - {v: "1", l: "Poison records in DLT", s: "Diverted to events.ingest.DLT", tone: warn}
      - {v: "0", l: "Head-of-line delays", s: "Valid messages processed immediately", tone: good}
    lines:
      - emma: "In our integration test suite, we sent ten valid batches and injected one corrupt payload in the middle."
        focus: 1
      - emma: "All eleven offsets committed cleanly. The ten valid batches saved to the database, and the single corrupt record routed to the dead letter topic."
        focus: 2
      - tom: "Total lag on the main topic remained at zero throughout the test."

  - kind: pattern
    chapter: "Re-drive tooling"
    heading: "Production re-drive workflow"
    bad: |
      // ANTI-PATTERN: Ignoring DLT alerts until disk fills
      // 100,000 corrupt messages accumulate silently
      // Nobody inspects DLT topic for six months
    good: |
      // OPERATIONAL EXCELLENCE:
      // 1. Alert when DLT rate > 0.01%
      // 2. Fix producer schema bug or parser logic
      // 3. Run replay batch consumer from .DLT back to main topic
    lines:
      - tom: "What is the biggest operational mistake teams make after setting up a dead letter topic?"
        focus: 0
      - emma: "Treating the dead letter topic as a garbage dump and ignoring it. Without monitoring, dead letter topics fill disk storage silently."
        focus: 1
      - emma: "Set a Prometheus alert on dead letter message rates, investigate errors promptly, and build an automated replay tool to re-drive fixed messages."


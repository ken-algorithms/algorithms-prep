  - src: ../katalon-prep/katalon-system-design/07-event-counting-10m-100m.md#54-exactly-once-về-hiệu-quả-từ-các-mảnh-at-least-once
    title: "07 · Exactly-once từ các mảnh at-least-once"
    points:
      - {id: x-three, text: "Ba mảnh: client gửi lại cùng batch_id, bỏ cuộc sau 10 phút (cửa sổ retry < cửa sổ khử trùng); stream processor bỏ batch_id đã thấy trong 15 phút, state = 166.667/s × 900 s ≈ 150 triệu khoá ≈ 7–8 GB (Little's Law), hết hạn theo event time; sink ghi đè bằng giá trị lớn hơn", expect: ["same batch_id", "10 minutes", "retry window < dedup window", "15 minutes", "900", "150M keys", "Little's Law", "event time", "GREATEST"]}
      - {id: x-greatest, text: "Upsert agg_1m (tenant, phút, outcome) với cnt = GREATEST(cnt cũ, cnt mới): mỗi dòng là cả số đếm, không phải +1; số cũ nhỏ hơn không thay được số mới lớn hơn", expect: ["INSERT INTO agg_1m", "ON CONFLICT", "GREATEST", "not a \\+1", "older, smaller count"]}
      - {id: x-why, text: "Vì sao GREATEST đúng: sau khử trùng số đếm chỉ tăng; khôi phục từ checkpoint phát số nhỏ hơn rồi tăng lại (bị bỏ qua); consumer xác sống sau GC pause cầm số cũ hơn (bị bỏ qua); event trễ trong 30 phút cho số lớn hơn (nhận); giới hạn: không hạ được số quá cao (retry sau khi khoá hết hạn) → batch đối soát", expect: ["only goes up", "checkpoint", "zombie", "GC pause", "late event within 30 minutes", "too high", "batch reconcile"]}
      - {id: x-fencing, text: "GREATEST là fencing token của lab 10A: client không tự biết mình đã pause quá TTL, chỉ nơi lưu trữ từ chối được người ghi cũ; ở đây con số đếm chính là token", expect: ["lab 10A", "fencing token", "TTL", "Only the storage", "the count itself is the token"]}
      - {id: x-late, text: "Event trễ: trong 30 phút thì cửa sổ tính lại và phát số lớn hơn; trễ hơn thì đi topic late + bộ đếm events_late, raw vẫn có nên đối soát đếm đủ, không bỏ im lặng", expect: ["within 30 minutes", "late.{1,3}topic", "events_late", "raw still has them", "silently"]}
      - {id: x-reconcile, text: "Đối soát mỗi giờ: đếm lại từ raw đóng gói, khử trùng batch_id cả giờ, so với rollup, reconcile_drift phải bằng 0; sửa vào final_cnt riêng, đọc COALESCE(final_cnt, cnt), đánh dấu is_final, billing chỉ đọc giờ đã chốt; hai đường dùng chung code phân loại", expect: ["Recount every hour", "reconcile_drift", "final_cnt", "COALESCE", "is_final", "Billing", "classification code"]}

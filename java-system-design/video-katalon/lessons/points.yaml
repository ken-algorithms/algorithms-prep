    text: 'Câu trả lời cũ: insert theo chunk, lock và cộng vào tổng 24 giờ, đọc bản ghi cuối; ý đúng: đếm trước thay vì đếm lúc hỏi'
    expect:
    - lock
    - last record
    - count ahead of time

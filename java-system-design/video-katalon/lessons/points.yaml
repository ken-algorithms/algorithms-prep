  points:
  - id: k-numbers
    text: 'Ước lượng: 167 request/s × 20 = 3.333 event/s, 288 triệu/ngày, ~17 GB raw/ngày; ''24 giờ qua'' chỉ 96 dòng → không bao giờ quét raw'
    expect:
    - '167'
    - 3,333
    - 288M
    - 17 GB
    - 96 rows
  - id: a2-read-cost
    text: '''24 giờ qua'' = 288 triệu dòng mỗi lần refresh; một năm 105 tỷ; index không đổi bản chất'
    expect:
    - 288M
    - 105 billion
    - index

sections:
  # ---------------------------------------------------------------- README của folder system design
  - src: ../katalon-prep/katalon-system-design/README.md#1-nhận-họ-bài-trong-30-giây--5-trục-phân-loại
    title: "README · 5 trục phân loại"
    points:
      - {id: k-axes, text: "5 trục nhận họ bài chạy trên đề 10k/phút: ghi ≫ đọc (ghi bất đồng bộ, 202); đọc theo khoảng (bucket + rollup); không tranh tài nguyên; chính xác (raw, idempotent, đối soát); không đọc–tính–ghi (không khoá)", expect: ["write-heavy or read-heavy", "point or (by )?range", "finite resource", "exact or approximate", "read, compute", "202", "no lock"]}
  - src: ../katalon-prep/katalon-system-design/README.md#2-bảy-họ-bài--chữ-ký-nhận-dạng-lõi-giải-pháp-bẫy-kinh-điển
    title: "README · Bảy họ bài"
    points:
      - {id: k-family-a, text: "Họ A (đếm & tổng hợp theo thời gian): ghi nặng, đọc theo khoảng bất kỳ; bucket thời gian + rollup phút → giờ → ngày + phân rã khoảng; bẫy: cardinality explosion, lưu tỉ lệ, bucket theo ingest time", expect: ["counting and aggregation", "any time range", "rollups", "cardinality explosion", "ratios", "ingest time"]}
      - {id: k-family-c, text: "Họ C (thu thập luồng sự kiện): nguồn không kiểm soát; backpressure + at-least-once + sink idempotent + partition key giữ thứ tự đúng phạm vi; bẫy: hàng đợi vô hạn, partition nóng, PII rời client trước khi redact", expect: ["ingestion", "don't control", "backpressure", "idempotent sink", "partition key", "unbounded queues", "hot partitions", "PII"]}
  # ---------------------------------------------------------------- 04 — bài gốc 10k/phút
  - src: ../katalon-prep/katalon-system-design/04-event-counting-10k.md#0-đề-bài-và-những-gì-đề-bài-không-nói
    title: "04 · Đề bài"
    points:
      - {id: k-question, text: "Đề hỏi thật ở vòng Principal: ~10.000 request/phút, mỗi request một list key-value true/false, có fake key; bất kỳ lúc nào hỏi được số true/false/fake trong 24 giờ hoặc khoảng bất kỳ. Câu trả lời tại chỗ (một counter, lock, đọc bản ghi cuối) bị bác; follow-up: 10M? 100M?", expect: ["10,000 requests a minute", "key-value", "fake", "24 hours", "any time range", "Principal", "rejected", "10 million", "100 million"]}
  - src: ../katalon-prep/katalon-system-design/04-event-counting-10k.md#1-vì-sao-câu-trả-lời-cũ-bị-bác--4-lỗ-hổng
    title: "04 · 4 lỗ hổng"
    points:
      - {id: b-holes, text: "4 lỗ hổng: counter lũy kế không trả lời được khoảng bất kỳ; lock ở write path serialize mọi ghi trên một hot row; counter là nguồn sự thật duy nhất nên retry đếm trùng, không backfill/đối soát; bucket theo thời điểm insert làm lệch khung giờ", expect: ["cumulative counter", "arbitrary range", "lock", "hot row", "retries double-count", "insert time", "wrong bucket"]}
  - src: ../katalon-prep/katalon-system-design/04-event-counting-10k.md#2-trước-khi-vẽ-6-câu-hỏi-phải-hỏi-interviewer
    title: "04 · Câu hỏi trước khi vẽ"
    points:
      - {id: b-clarify, text: "Hỏi trước khi vẽ: bao nhiêu cặp/request (10 → 1,7k event/s; 1.000 → 167k event/s); tổng hay theo từng key (cardinality explosion); dashboard hay billing (billing cần chính xác, raw, idempotent, đối soát)", expect: ["pairs per request", "1.7k events/s", "167k events/s", "per key", "dashboard", "billing", "reconciliation"]}
  - src: ../katalon-prep/katalon-system-design/04-event-counting-10k.md#3-ước-lượng-tải--con-số-quyết-định-kiến-trúc
    title: "04 · Ước lượng tải"
    points:
      - {id: b-estimate, text: "167 req/s × 20 = 3.333 event/s; 288 triệu event/ngày, ~17 GB raw/ngày → không bao giờ quét raw; '24h qua' chỉ đọc 96 dòng (24 bucket giờ × 4 outcome)", expect: ["3,333", "167", "288M", "17 GB", "96 rows", "24 hourly buckets"]}
  - src: ../katalon-prep/katalon-system-design/04-event-counting-10k.md#4-design-tầng-1--bản-tối-giản-đúng
    title: "04 · Design tầng 1"
    points:
      - {id: b-design, text: "Tầng 1: API validate, phân loại, append raw theo lô không lock, trả 202; raw_events là nguồn sự thật 7 ngày; rollup bất đồng bộ theo event time agg_1m → agg_1h → agg_1d; query phân rã khoảng, cộng bucket, không chạm raw", expect: ["202", "raw_events", "source of truth", "agg_1m", "event time", "split the range", "never touches raw"]}
      - {id: b-principles, text: "Ba nguyên tắc: ghi tách khỏi tính; đếm theo bucket thời gian chứ không một counter tổng; raw là sự thật, rollup là dẫn xuất (tính lại, backfill, đối soát)", expect: ["separate from compute", "time bucket", "not one total", "raw is the truth", "derived", "recompute"]}
  - src: ../katalon-prep/katalon-system-design/04-event-counting-10k.md#63-thuật-toán-phân-rã-khoảng-thời-gian-bất-kỳ
    title: "04 · Phân rã khoảng"
    points:
      - {id: b-decompose, text: "Phân rã tham lam (khối thô nhất còn vừa): 03:17:30 → 11:42:10 ba ngày sau = 2 lần đọc raw + 84 dòng phút + 31 dòng giờ + 2 dòng ngày ≈ 120 dòng, thay vì quét 864 triệu dòng raw; truy vấn 1 năm tối đa ~530 dòng, chi phí bị chặn", expect: ["coarsest block", "84", "31", "864,000,000", "five hundred thirty", "bounded"]}
  - src: ../katalon-prep/katalon-system-design/04-event-counting-10k.md#64-idempotency--vì-sao-counter-không-phải-nguồn-sự-thật
    title: "04 · Idempotency ở tầng raw"
    points:
      - {id: b-details, text: "Chi tiết ghi điểm: event time + cửa sổ tính lại 30 phút cho event trễ; lưu count không lưu tỉ lệ; idempotency ở raw bằng event_id + ON CONFLICT DO NOTHING; job đối soát mỗi giờ so với COUNT(*) trên raw", expect: ["30-minute", "never ratios", "event_id", "ON CONFLICT DO NOTHING", "hourly", "COUNT\\(\\*\\)"]}
  - src: ../katalon-prep/katalon-system-design/04-event-counting-10k.md#7-chọn-tech-stack--3-phương-án-và-ngưỡng-chuyển
    title: "04 · Ngưỡng chuyển stack"
    points:
      - {id: b-rightsize, text: "3,3k event/s: một node Postgres + TimescaleDB đủ (~1/10 khả năng); không Kafka (gấp 4 hệ thống phải vận hành). Ngưỡng: cache khi p99 đọc 24h > 50 ms hoặc > 1.000 đọc/s; Kafka + stream + kho cột khi > 50k event/s, cardinality theo key > 10k, replay > 7 ngày, hoặc nhiều consumer", expect: ["TimescaleDB", "a tenth", "No Kafka", "50 ms", "1,000/s", "50k events/s", "> 10k", "7 days", "many consumers"]}
  - src: ../katalon-prep/katalon-system-design/04-event-counting-10k.md#11-kịch-bản-trình-bày-3-phút
    title: "04 · Bốn câu nếu chỉ nhớ bốn câu"
    points:
      - {id: b-four, text: "Bốn câu: ghi tách khỏi tính (append, 202, async); đếm theo bucket thời gian; raw là sự thật, rollup là dẫn xuất; tải này chưa cần Kafka và đây là ngưỡng chuyển", expect: ["separate from compute", "202", "per time bucket", "Raw is the truth", "doesn't need Kafka yet"]}
  # ---------------------------------------------------------------- 07 — 10M và 100M
  - src: ../katalon-prep/katalon-system-design/07-event-counting-10m-100m.md#0-đọc-trong-60-giây
    title: "07 · Đọc trong 60 giây"
    points:
      - {id: k-ladder-preview, text: "Cùng hợp đồng, ba mức tải (20 cặp/request): 10k/phút = 3.333 event/s; 10M/phút = 3,3 triệu event/s (× 1.000, 166.667 req/s); 100M/phút = 33 triệu event/s (× 10.000, 1,67 triệu req/s); bảng trả lời truy vấn không lớn thêm", expect: ["20 key-value pairs", "3,333", "3.3 million", "× 1,000", "166,667", "33 million", "× 10,000", "doesn't grow"]}
      - {id: k-practice, text: "Cách luyện: Tom hỏi thì dừng và trả lời thành tiếng 2 phút có số; nói giả định trước con số; trả lời × 10 bằng năm câu; gọi tên bài học gốc (slide Built on)", expect: ["pause and answer out loud", "two minutes", "assumption before the number", "five sentences", "Built on"]}
  - src: ../katalon-prep/katalon-system-design/07-event-counting-10m-100m.md#1-đề-mở-rộng--hỏi-lại-gì-trước-khi-trả-lời
    title: "07 · Hỏi lại gì ở 10M–100M"
    points:
      - {id: l-ask, text: "Chốt cách hiểu rồi hỏi: vẫn 20 item/request (20 → 3,3M; 200 → 33M event/s); bao nhiêu client, gửi dày hay thưa (gộp ở client được không); một region hay toàn cầu (cell, luật dữ liệu); dashboard hay billing (billing chỉ dùng số đã đối soát)", expect: ["20 pairs", "33M events/s", "How many clients", "pre-aggregate", "worldwide", "regional cells", "billing", "reconciled"]}
  - src: ../katalon-prep/katalon-system-design/07-event-counting-10m-100m.md#2-thang-ước-lượng-10k--100m-requestphút
    title: "07 · Thang ước lượng"
    points:
      - {id: l-ladder, text: "Thang: 10k → 167 req/s, 3.333 event/s, 288 triệu/ngày, 17 GB; 100k → 33.333 event/s, 173 GB; 1M → 333.333 event/s, 1,7 TB; 10M → 166.667 req/s, 3,3 triệu event/s, 288 tỷ/ngày, 17 TB, ~1,3 Gbit/s; 100M → 1,67 triệu req/s, 33 triệu event/s, 2.880 tỷ/ngày, 173 TB, ~13 Gbit/s; đỉnh × 3", expect: ["167", "3,333", "33,333", "333,333", "166,667", "288B", "17 TB", "1.3 Gbit/s", "1.67 million", "33 million", "2,880B", "173 TB", "13 Gbit/s", "× 3"]}
  - src: ../katalon-prep/katalon-system-design/07-event-counting-10m-100m.md#31-rollup-lớn-theo-số-nhóm-không-theo-số-event
    title: "07 · Rollup lớn theo số nhóm"
    points:
      - {id: l-read-constant, text: "Số dòng rollup = tenant × outcome × bucket, không có event/s trong công thức: 1 tenant tầng phút 5.760 dòng/ngày ở mọi mức tải; 10.000 tenant 57,6 triệu; truy vấn 1 năm vẫn ~530 dòng — đường đọc không đổi, mọi thay đổi ở đường ghi", expect: ["tenants × outcomes × buckets", "5,760", "57.6 million", "530", "write path"]}
  - src: ../katalon-prep/katalon-system-design/07-event-counting-10m-100m.md#32-cardinality-nổ-hay-không-là-tương-đối
    title: "07 · Cardinality là tương đối"
    points:
      - {id: l-cardinality, text: "Hệ số gộp = event mỗi bucket ÷ số nhóm; 100.000 key × 4 outcome = 400.000 nhóm: ở 10k/phút ≤ 0,5 (vô ích), ở 10M/phút = 500 (đáng làm); nhưng 576 triệu dòng/ngày/tenant → việc của kho OLAP, không phải Postgres", expect: ["400,000 groups", "≤ 0.5", "500", "ratio", "five hundred seventy-six million", "OLAP"]}
  - src: 02-ve-he-thong-100k-1m-10m.md#5-câu-hỏi-tải-tăng-10-lần-thì-sao--cách-trả-lời
    title: "02 · Năm câu trả lời × 10 (giai đoạn 1)"
    points:
      - {id: l-five, text: "Năm câu của câu hỏi × 10: số mới; vỡ trước (có số); sửa và đánh đổi; vỡ tiếp; chưa làm gì (và vì sao còn dư)", expect: ["New numbers", "Breaks first", "trade-off", "Breaks next", "Not yet"]}
  - src: ../katalon-prep/katalon-system-design/07-event-counting-10m-100m.md#41--10--100k-requestphút
    title: "07 · × 10: 100k/phút"
    points:

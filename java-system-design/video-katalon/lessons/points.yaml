  - src: ../katalon-prep/katalon-system-design/07-event-counting-10m-100m.md#75-metric-thêm-vào-sáu-metric-của-04
    title: "07 · Metric thêm"
    points:
      - {id: c-metrics, text: "Metric thêm: consumer_lag_seconds theo partition (một partition lag riêng = partition nóng); dedup_hits_per_sec (client retry hàng loạt); events_late, events_clock_skew; reconcile_drift theo cell; collector_cpu_us_per_request (+10 µs = +17 core ở 100M)", expect: ["consumer_lag_seconds", "hot partition", "dedup_hits_per_sec", "events_late", "events_clock_skew", "reconcile_drift per cell", "collector_cpu_us_per_request", "17 cores"]}
  - src: ../katalon-prep/katalon-system-design/07-event-counting-10m-100m.md#9-bản-đồ-nối-với-giai-đoạn-1-và-giai-đoạn-2
    title: "07 · Bản đồ nối với giai đoạn 1 và 2"
    points:
      - {id: k-plan, text: "Thứ tự xem: K00–K02 sau giai đoạn 1 (ước lượng, × 10, Postgres); K03–K07 sau giai đoạn 2 (Kafka, stream window, fencing)", expect: ["After phase 1", "K00", "K02", "After phase 2", "K03", "K07", "fencing"]}
      - {id: b-built-on, text: "K01 dựa trên giai đoạn 1: ước lượng (Ep01–Ep03), luật của thang (Ep06), quy tắc idempotency key (tuần 2), cache version-bump và single-flight (tuần 4)", expect: ["Phase 1", "Ep01–Ep03", "Ep06", "idempotency-key rules", "single-flight"]}
      - {id: l-built-on, text: "K02 dựa trên giai đoạn 1: quy đổi (Ep01), thang L0–L4 và năm câu (Ep06), storage engine và index (tuần 3); xem trước giai đoạn 2: Kafka acks, bản sao (Ep12)", expect: ["Ep01", "Ep06", "L0–L4", "week 3", "Phase 2", "Ep12"]}
      - {id: m-built-on, text: "K03 dựa trên giai đoạn 2: partition nóng (Ep03), thứ tự chỉ trong partition và đổi số partition (Ep12), cửa sổ theo event time và đề ad click cùng họ A (Ep17); luật 'chưa làm' của thang (giai đoạn 1 Ep06)", expect: ["Ep03", "Ep12", "Ep17", "Ad clicks", "Ep06"]}
      - {id: x-built-on, text: "K04 dựa trên: idempotency key (giai đoạn 1 tuần 2) và ba tầng idempotency (Ep08); at-least-once + sink idempotent, transaction dừng ở Kafka (Ep13, Ep15); Little's Law (giai đoạn 1 Ep01); đồng hồ (Ep19); fencing token (Ep20)", expect: ["idempotency keys", "Ep08", "Ep13", "Ep15", "Little's Law", "Ep19", "Ep20"]}
      - {id: h-built-on, text: "K05 dựa trên: Track P (giai đoạn 1 Ep04, Ep05), cell ở bậc L4 (file 02, Ep25 kế hoạch); giai đoạn 2: CRDT (Ep01), không 2PC (Ep07), sequence của producer (Ep12–Ep13)", expect: ["Ep04", "Ep05", "L4", "Ep01", "Ep07", "Ep12"]}
      - {id: c-built-on, text: "K06 dựa trên: P13 và lab 2 token bucket (giai đoạn 1), backpressure (Ep13), P20 (Ep16), Kafka key và compacted topic (Ep12), redact ở client của đề Katalon 01", expect: ["P13", "lab 2", "Ep13", "Ep16", "Ep12", "problem 01"]}
      - {id: t-map-1a, text: "Bản đồ giai đoạn 1, video đã dựng: ước lượng (Ep01–Ep03), Little's Law (Ep01), năm câu × 10 và 'chưa làm' (Ep06), 1 µs = 1,7 core (Track P Ep04, Ep05)", expect: ["Ep01–Ep03", "Little's Law", "Ep06", "Ep04, Ep05", "1.7 cores"]}
      - {id: t-map-1b, text: "Bản đồ giai đoạn 1, tuần 2–4 (video chưa dựng): cả thang L0–L4 và cell (Ep25), quota/429/HTTPS ở edge và idempotency key (tuần 2), B-tree hay LSM (tuần 3), cache và đánh đổi nhất quán (tuần 4)", expect: ["Ep25", "Week 2", "idempotency-key", "LSM", "Week 4", "consistency trade-offs"]}
      - {id: t-map-2a, text: "Bản đồ giai đoạn 2, phần Kafka: partition nóng (Ep03), key/thứ tự/acks (Ep12), at-least-once + sink idempotent (Ep13, Ep15), P20 (Ep16)", expect: ["Ep03", "Ep12", "Ep13, Ep15", "Ep16"]}
      - {id: t-map-2b, text: "Bản đồ giai đoạn 2, phần stream và hệ phân tán: window và ad click (Ep17), đồng hồ và fencing (Ep19, Ep20), cell cộng như CRDT (Ep01), không 2PC (Ep07)", expect: ["Ep17", "Ep19, Ep20", "CRDT", "Ep01", "Ep07"]}
  - src: ../katalon-prep/katalon-system-design/07-event-counting-10m-100m.md#10-ranh-giới-trung-thực
    title: "07 · Ranh giới trung thực"
    points:
      - {id: t-honest, text: "Mọi số là phép tính từ giả định (20 cặp, 1 KB, 0,2 ms); ngưỡng là bậc độ lớn; P01/P04 là số đo thật nhưng nhân lên là ước lượng; giá là giá niêm yết; không có demo ở 10M/100M: nói 'tôi sẽ dựng và đo thế này', không nói 'tôi đã chạy'", expect: ["assumptions", "orders of magnitude", "real measurements", "list prices", "I would build", "I ran it"]}

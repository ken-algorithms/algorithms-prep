# ---- Datasource ----
# Trong test, EmbeddedPostgresResource ghi de URL nay (xem src/test).
# Dev services cua Quarkus bi TAT vi may khong co Docker.
quarkus.datasource.db-kind=postgresql
quarkus.devservices.enabled=false
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/testops
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres
quarkus.datasource.jdbc.max-size=16

# ---- Hibernate ----
# KHONG dung schema generation. Flyway la nguon su that duy nhat cho schema.
quarkus.hibernate-orm.schema-management.strategy=none
# Batch insert: 3 property nay phai co DU, thieu mot cai la batch khong hoat dong.
quarkus.hibernate-orm.jdbc.statement-batch-size=100
quarkus.hibernate-orm.unsupported-properties."hibernate.order_inserts"=true
quarkus.hibernate-orm.unsupported-properties."hibernate.order_updates"=true

# ---- Flyway ----
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true

# ---- Health ----
quarkus.smallrye-health.root-path=/q/health

# ---- Log ----
quarkus.log.level=INFO
quarkus.log.category."com.prep".level=DEBUG
%test.quarkus.log.level=WARN

spring.application.name=spring-testops

# ---- Datasource (test ghi de bang @DynamicPropertySource) ----
spring.datasource.url=jdbc:postgresql://localhost:5432/testops
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.hikari.maximum-pool-size=16

# ---- JPA ----
# none: Flyway la nguon su that duy nhat cho schema.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
# Batch insert: DU ca 3 property. Thieu order_inserts thi batch bi chia nho khong hieu qua.
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ---- Flyway ----
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# ---- VIRTUAL THREADS (Java 21) ----
# Mot dong nay bien moi request HTTP thanh mot virtual thread thay vi lay tu Tomcat thread pool.
# Voi endpoint blocking (JDBC), day la cach re nhat de tang throughput.
# Xem module 04 de biet 3 quy tac va bay khi dung virtual thread.
spring.threads.virtual.enabled=true

# ---- Actuator ----
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

logging.level.root=INFO
logging.level.com.prep=DEBUG
